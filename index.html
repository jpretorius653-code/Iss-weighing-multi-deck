<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="light only"/>
<meta name="theme-color" content="#0C0C0E"/>
<!-- manifest link removed: the PWA manifest isn't used in the packaged
     desktop build and the missing ./manifest.json triggered a "Not allowed
     to load local resource" error that blanked the renderer. -->
<title>ISS Weighbridge</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#EEF3FA;color:#1A2A3A;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overflow:hidden;color-scheme:light}
:root{
  /* ISS brand: navy -> deep navy -> ISS blue */
  --navy:#1A3A6B; --navy2:#12294D; --blue:#2183C2; --light:#29ABE2;
  --grey:#6B7480; --grey-d:#333A41;
  --bg:#EEF3FA; --card:#ffffff; --border:#D8E2EE; --border2:#C3D2E4;
  --text:#1A2A3A; --text2:#4A6080; --text3:#8AA0B8;
  --green:#1F9D57; --greenl:#E4F6EC; --red:#D24A36; --redl:#FBE9E5;
  --amber:#C8881A; --amberl:#FCF1DC; --r:10px;
}
input,select,textarea{color:#1A2A3A!important;background:#fff!important;border:1.5px solid var(--border2);border-radius:8px;padding:9px 12px;outline:none;width:100%;font-family:inherit;font-size:13px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(33,131,194,.14)}
button{cursor:pointer;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.06)} button:active{transform:scale(.98)}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:7px}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:7px;opacity:.6;border:3px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{opacity:1;background:var(--navy);background-clip:padding-box;border:3px solid transparent}
datalist option{background:#fff;color:#1A2A3A}

/* FULLSCREEN OVERLAYS */
.fov{position:fixed;inset:0;background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 52%,var(--blue) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px}
.fov-card{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.fov-logo{display:flex;justify-content:center;margin-bottom:24px}
.fov-logo svg{height:64px;width:auto}
.fov-title{font-size:17px;font-weight:800;color:var(--navy);text-align:center;margin-bottom:6px}
.fov-sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:20px}

/* PIN PAD */
.pin-display{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue);background:#EEF3FA;transition:background .15s}
.pin-dot.filled{background:var(--blue)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pin-btn{padding:16px;border-radius:10px;background:#EEF3FA;color:var(--navy);font-size:20px;font-weight:700;border:1.5px solid var(--border);text-align:center}
.pin-btn:active{background:var(--blue);color:#fff;border-color:var(--blue)}
.user-cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.user-card{padding:12px 18px;border-radius:10px;background:#EEF3FA;border:2px solid var(--border);cursor:pointer;text-align:center;min-width:90px;transition:all .15s}
.user-card:hover,.user-card.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.user-card .uc-n{font-weight:800;font-size:13px}
.user-card .uc-r{font-size:10px;opacity:.7;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;max-height:100dvh}
#deckbar{display:flex;gap:1px;background:#0d1828;border-bottom:1px solid #27405c;flex-shrink:0;overflow-x:auto}
.dk{flex:1;min-width:78px;padding:5px 8px;background:#101f33;border-top:3px solid var(--text3)}
.dk-l{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text3)}
.dk-v{font-family:'Courier New',monospace;font-size:16px;font-weight:800;line-height:1.15}
.dk-x{font-size:9.5px;font-family:'Courier New',monospace;color:var(--text3)}
#hdr{background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 48%,var(--blue) 100%);height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:3px solid var(--blue);box-shadow:0 2px 16px rgba(0,0,0,.3)}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-logo{height:44px;width:auto;flex-shrink:0}
.hdr-names{line-height:1.2}
.hdr-co{font-size:14px;font-weight:900;color:#fff;letter-spacing:.3px}
.hdr-tag{font-size:9px;color:var(--light);letter-spacing:2px;font-weight:700;text-transform:uppercase;margin-top:1px}
.hdr-r{display:flex;align-items:center;gap:10px}
.bridge-pill{padding:4px 10px;border-radius:6px;border:1.5px solid rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);cursor:pointer}
.bridge-pill.active{background:var(--blue);border-color:var(--blue)}
.conn-pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.2)}
.w-hdr{display:flex;align-items:baseline;gap:3px}
#hdr-wt{font-size:26px;font-weight:900;font-family:'Courier New',monospace;color:#fff;letter-spacing:2px;min-width:80px;text-align:right;transition:color .3s}
#hdr-wt.over{color:#FF5D5D!important;animation:flash .5s infinite alternate}
@keyframes flash{from{opacity:1}to{opacity:.3}}
#hdr-unit{font-size:12px;color:var(--light);font-weight:700}
.hdr-user{padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
.hdr-user:hover{background:rgba(255,255,255,.22)}

/* TABS */
#tab-bar{display:flex;background:#fff;border-bottom:2px solid var(--border);flex-shrink:0;overflow-x:auto}
#tab-bar::-webkit-scrollbar{height:10px}
.tab{padding:12px 16px;border:none;background:transparent;color:var(--text3);font-size:12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;margin-bottom:-2px}
.tab.on{color:var(--navy);border-bottom-color:var(--blue);background:#f0f6fb}
.tab:hover:not(.on){color:var(--blue);background:#f7fafd}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}

/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(26,58,107,.07)}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:10px;font-weight:800;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-hd h2{font-size:16px;font-weight:800;color:var(--navy)}
.sec-hd .sub{font-size:11px;color:var(--text3);margin-top:2px}

/* BUTTONS */
.btn{padding:10px 18px;font-weight:700;border-radius:8px;font-size:13px}
.btn-navy{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.btn-blue{background:linear-gradient(135deg,var(--blue),#1A6FA8);color:#fff}
.btn-light{background:linear-gradient(135deg,var(--light),var(--blue));color:#fff}
.btn-green{background:linear-gradient(135deg,#1B7A43,#15613A);color:#fff}
.btn-red{background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff}
.btn-ghost{background:#EEF3FA;color:var(--text2);border:1.5px solid var(--border2)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-amber{background:linear-gradient(135deg,#D97706,#B45309);color:#fff}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-full{width:100%;display:block;text-align:center;padding:13px}

/* FORM */
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:800;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* WEIGHT BOXES */
.wbox-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.wbox{background:#f8fafc;border:1.5px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.wbox.net{background:#EEF3FA;border-color:var(--blue);border-width:2px}
.wbox-lbl{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.wbox-val{font-size:22px;font-weight:900;font-family:'Courier New',monospace;color:var(--text)}
.wbox.net .wbox-val{color:var(--navy);font-size:26px}
.wbox-t{font-size:10px;color:var(--text3);margin-top:2px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:8px;border:1px solid var(--border);padding:14px;text-align:center;border-top:3px solid var(--blue)}
.stat-v{font-size:26px;font-weight:900;font-family:'Courier New',monospace;color:var(--navy)}
.stat-l{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.stat.green{border-top-color:var(--green)} .stat.green .stat-v{color:var(--green)}
.stat.amber{border-top-color:var(--amber)} .stat.amber .stat-v{color:var(--amber)}
.stat.red{border-top-color:var(--red)} .stat.red .stat-v{color:var(--red)}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-blue{background:#DBEAFE;color:#1A3A6B}
.b-green{background:var(--greenl);color:var(--green)}
.b-red{background:var(--redl);color:var(--red)}
.b-amber{background:var(--amberl);color:var(--amber)}
.b-gray{background:#F1F5F9;color:var(--text2)}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;border-bottom:2px solid var(--border);color:var(--text3);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#f8fafc;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:#f7fafd}

/* MODAL */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8888;display:none;align-items:center;justify-content:center;padding:20px}
#modal-bg.open{display:flex!important}
#modal-box{background:#fff;border-radius:14px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.modal-hdr h3{font-size:15px;font-weight:800;color:var(--navy)}
.modal-close{background:none;border:none;font-size:22px;color:var(--text3);cursor:pointer;padding:0 4px;line-height:1}
.modal-body{padding:20px}

/* WEIGHBOARD DRAWER */
#wb{position:fixed;bottom:0;left:0;right:0;z-index:7777;background:linear-gradient(135deg,var(--navy),var(--navy2));border-top:2px solid var(--blue);transition:transform .28s cubic-bezier(.4,0,.2,1)}
#wb.closed{transform:translateY(calc(100% - 48px))}
#wb-bar{height:48px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
#wb-tag{font-size:11px;font-weight:800;color:var(--light);letter-spacing:2px;display:flex;align-items:center;gap:8px}
#wb-live{font-size:24px;font-weight:900;font-family:'Courier New',monospace;color:var(--blue);letter-spacing:2px}
#wb-body{padding:12px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* SETTINGS ROWS */
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.sr:last-child{border-bottom:none}
.sr-l{flex:1}
.sr-lbl{font-size:13px;font-weight:600;color:var(--text)}
.sr-sub{font-size:11px;color:var(--text3);margin-top:2px}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--border2);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--blue)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:9px;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{left:23px}
.sg{margin-bottom:20px}
.sg-title{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:4px;padding-bottom:6px;border-bottom:2px solid var(--border)}

/* TRUCKS ON SITE */
.truck-card{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
.truck-card:hover{border-color:var(--blue);background:#f0f6fb}
.tc-reg{font-size:18px;font-weight:900;font-family:'Courier New',monospace;letter-spacing:2px;color:var(--navy)}
.tc-info{font-size:11px;color:var(--text3);margin-top:3px}
.tc-timer{font-size:10px;color:var(--amber);margin-top:2px;font-weight:700}
.tc-w{font-size:15px;font-weight:900;font-family:'Courier New',monospace;color:var(--navy);text-align:right}
.tc-wl{font-size:10px;color:var(--text3);text-align:right;margin-top:2px}

/* DB LIST */
.db-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
.db-item:last-child{border-bottom:none}
.db-item .di-name{font-weight:600;flex:1}
.db-item .di-rate{font-size:11px;color:var(--blue);font-weight:700;margin-right:10px}

/* PERMISSION CHIPS */
.perm-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid;user-select:none;transition:all .15s}
.perm-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.perm-chip.off{background:#EEF3FA;color:var(--text3);border-color:var(--border)}

/* TOAST */
#toast{position:fixed;bottom:70px;right:18px;z-index:9999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.15);display:none;max-width:340px;border-left:4px solid;animation:slidein .2s}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
#toast.success{background:#fff;color:var(--green);border-color:var(--green)}
#toast.error{background:#fff;color:var(--red);border-color:var(--red)}
#toast.info{background:#fff;color:var(--navy);border-color:var(--blue)}

/* MISC */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty .ico{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6}
.dash-wrap{display:grid;grid-template-columns:1fr 340px;gap:12px}
@media(max-width:860px){.dash-wrap{grid-template-columns:1fr}}
.bar-chart{display:flex;align-items:flex-end;gap:3px;height:70px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--light),var(--blue));border-radius:2px 2px 0 0;min-height:2px}
.bar-lbl{font-size:8px;color:var(--text3)}
.order-prog{height:6px;background:var(--border);border-radius:3px;margin-top:6px;overflow:hidden}
.order-prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--light));border-radius:3px;transition:width .3s}

/* ISS light theme — base styles apply (dark overrides removed) */

/* orange monochrome icons */
.ti{color:transparent;text-shadow:0 0 0 var(--blue);margin-right:3px}
.empty .ico{color:transparent;text-shadow:0 0 0 var(--blue)}

/* stable / in-motion indicator */
.ns-motion{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;padding:4px 11px;border-radius:999px;border:1px solid var(--border);color:var(--text3);
  font-family:'Segoe UI',system-ui,sans-serif;white-space:nowrap;transition:color .2s,border-color .2s}
.ns-motion .ns-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:.2s}
.ns-motion.stable{color:var(--green);border-color:rgba(55,178,107,.45)}
.ns-motion.stable .ns-dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.ns-motion.motion{color:var(--amber);border-color:rgba(224,169,46,.45)}
.ns-motion.motion .ns-dot{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:nsPulse .55s infinite alternate}
@keyframes nsPulse{from{opacity:1}to{opacity:.3}}
#hdr-motion{padding:3px 9px;font-size:10px}
</style>
</head>
<body>

<!-- ACTIVATION OVERLAY -->
<div id="ovr-act" class="fov">
  <div class="fov-card">
    <div class="fov-logo" id="act-logo"></div>
    <div class="fov-title">ISS Weighbridge</div>
    <div class="fov-sub">Enter your activation code to unlock this software</div>
    <div class="field"><label>Activation Code</label>
      <input id="act-input" placeholder="e.g. ISS2025" autocomplete="off" onkeydown="if(event.key==='Enter')doActivate()"/>
    </div>
    <button class="btn btn-navy btn-full" style="margin-top:6px" onclick="doActivate()">🔓 Activate</button>
    <div style="text-align:center;margin-top:12px;font-size:11px;color:var(--text3)">Contact Industrial Scale Solutions for your activation code</div>
  </div>
</div>

<!-- LOGIN OVERLAY -->
<div id="ovr-login" class="fov" style="display:none">
  <div class="fov-card">
    <div class="fov-logo" id="login-logo"></div>
    <div class="fov-title" id="login-title">Welcome</div>
    <div class="fov-sub">Select your name, then enter your PIN</div>
    <div class="user-cards" id="user-cards"></div>
    <div id="pin-area" style="display:none">
      <div style="font-size:11px;font-weight:800;color:var(--text3);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px" id="pin-user-name"></div>
      <div class="pin-display" id="pin-dots"></div>
      <div class="pin-pad" id="pin-pad"></div>
      <button class="btn btn-ghost btn-full" style="margin-top:12px;font-size:12px" onclick="selectUser(null)">← Back</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <div id="hdr">
    <div class="hdr-l">
      <div id="hdr-logo-wrap"></div>
      <div class="hdr-names">
        <div class="hdr-co" id="hdr-co">Industrial Scale Solutions</div>
        <div class="hdr-tag" id="hdr-tag">Weighbridge</div>
      </div>
    </div>
    <div class="hdr-r">
      <div id="bridge-btns" style="display:none;gap:6px"></div>
      <div id="conn-pill" class="conn-pill">◎ Sim</div>
      <div class="w-hdr">
        <span id="hdr-wt">0</span>
        <span id="hdr-unit">kg</span>
      </div>
      <div id="hdr-motion" class="ns-motion stable"><span class="ns-dot"></span><span class="ns-motion-lbl">STABLE</span></div>
      <span id="saved-badge" style="font-size:10px;color:#FCD34D;font-weight:700;font-family:'Courier New',monospace;white-space:nowrap" title="Last backup">🖫 —</span>
      <div class="hdr-user" id="hdr-user" onclick="logout()">👤 ···</div>
    </div>
  </div>
  <div id="deckbar" style="display:none"></div>
  <div id="tab-bar"></div>
  <div id="content"></div>
</div>

<!-- WEIGHBOARD DRAWER -->
<div id="wb" class="closed" style="display:none">
  <div id="wb-bar" onclick="toggleWB()">
    <div id="wb-tag"><span class="ti">⚖</span> WEIGHBOARD &nbsp;<span id="wb-count" class="badge b-blue">0 on site</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="wb-live">0</span>
      <span style="font-size:11px;color:var(--light)" id="wb-unit">kg</span>
      <button style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:3px 10px;border-radius:5px;font-size:11px;font-weight:700" id="wb-btn">▲</button>
    </div>
  </div>
  <div id="wb-body">
    <button class="btn btn-navy btn-full" onclick="cap1()">📥 1st Weight</button>
    <button class="btn btn-blue btn-full" onclick="cap2()">📤 2nd Weight</button>
  </div>
</div>

<!-- MODAL -->
<div id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div id="modal-box">
    <div class="modal-hdr"><h3 id="modal-title">Modal</h3>

var qrcode = function() {

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],

    box.appendChild(hd);

// ── Enter-to-advance ───────────────────────────────────────────────
// Pressing Enter in a text/number/select field jumps to the next field in
// the same screen, so operators can key through the weigh form (and the
// complete-transaction modal) without reaching for the mouse. Enter on the
// LAST field does nothing destructive — the operator presses the weight
// button themselves. Textareas keep normal Enter (newline).
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  const el=e.target;
  if(!el || !el.tagName) return;
  const tag=el.tagName.toUpperCase();
  if(tag==='TEXTAREA' || tag==='BUTTON') return;      // don't hijack these
  if(tag!=='INPUT' && tag!=='SELECT') return;
  // collect the focusable fields within the same container (modal or content)
  const scope=el.closest('.modal-body, #content, .dash-wrap, body') || document;
  const fields=[].slice.call(scope.querySelectorAll('input:not([type=hidden]):not([disabled]), select:not([disabled])'))
                 .filter(function(f){ return f.offsetParent!==null; });   // visible only
  const i=fields.indexOf(el);
  if(i>=0 && i<fields.length-1){
    e.preventDefault();
    const nxt=fields[i+1];
    nxt.focus();
    if(nxt.select) try{ nxt.select(); }catch(_){}    // highlight so typing replaces
  } else if(i===fields.length-1){
    e.preventDefault();   // last field: swallow Enter so the form doesn't submit/reload
    el.blur();
  }
});

(function(){

    var disk = (window.issDesktop && window.issDesktop.diskState) || null;
    if(!disk) return;
    var keys=['iss8_act','iss8_cfg','iss8_usr','iss8_db','iss8_txs','iss8_pend','iss8_ord','iss8_audit','iss8_brand'];
    for(var i=0;i<keys.length;i++){
      var k=keys[i], cur=null;
      try{ cur=localStorage.getItem(k); }catch(e){}
      var empty = (cur===null||cur===''||cur==='null'||cur==='undefined');
      if(disk[k]!==undefined && empty){
        try{ localStorage.setItem(k, JSON.stringify(disk[k])); }catch(e){}
      } else if(disk[k]===undefined && !empty){
        // existing install: seed the durable store from current localStorage
        try{ if(window.issDesktop&&window.issDesktop.stateWrite) window.issDesktop.stateWrite(k, JSON.parse(cur)); }catch(e){}
      }
    }
  }catch(e){}

// ══════════════════════════════════════════════════════════
// SECURITY — salted SHA-256 hashing (PINs, activation code)
// Plaintext is never stored. Uses Web Crypto (built into browser).
// ══════════════════════════════════════════════════════════
const ISS_SALT='ISS-WeighForward-2025-Mpumalanga';   // app-wide salt
async function hashStr(str){
  try{
    const data=new TextEncoder().encode(ISS_SALT+'|'+str);
    const buf=await crypto.subtle.digest('SHA-256',data);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch{ // fallback for non-secure contexts (rare)
    let h=0;const x=ISS_SALT+'|'+str;
    for(let i=0;i<x.length;i++){h=((h<<5)-h+x.charCodeAt(i))|0;}
    return 'fb'+(h>>>0).toString(16);
  }
}
async function verifyHash(str,hash){ return (await hashStr(str))===hash; }

// PIN lockout state (rate limiting)
let _pinFails={};   // userId -> {count, until}
function pinLocked(userId){
  const f=_pinFails[userId];
  if(f&&f.until&&Date.now()<f.until){
    return Math.ceil((f.until-Date.now())/1000);
  }
  return 0;
}
function recordPinFail(userId){
  const f=_pinFails[userId]||{count:0,until:0};
  f.count++;
  // exponential backoff: 3 tries free, then 30s, 2min, 10min, 30min
  if(f.count>=3){
    const steps=[30,120,600,1800];
    const idx=Math.min(f.count-3,steps.length-1);
    f.until=Date.now()+steps[idx]*1000;
  }
  _pinFails[userId]=f;
}
function clearPinFail(userId){ delete _pinFails[userId]; }

// AUDIT TRAIL — append-only log of every significant action
// Who did what, when, with before/after values. Never editable
// from the UI. This is your legal protection for disputes.
// ══════════════════════════════════════════════════════════
let auditTrail=G('iss8_audit',[]);
function auditLog(action,entity,entityId,detail,before,after){
  const entry={
    id:Date.now()+'-'+Math.random().toString(36).slice(2,6),
    ts:new Date().toISOString(),
    user:session?session.name:'(system)',
    userId:session?session.userId:'',
    action,        // login, weigh1, weigh2, complete, void, edit, delete, reprint, access, config
    entity,        // tx, order, user, settings, db
    entityId:entityId||'',
    detail:detail||'',
  };
  if(before!==undefined) entry.before=before;
  if(after!==undefined)  entry.after=after;
  auditTrail.unshift(entry);
  if(auditTrail.length>5000) auditTrail=auditTrail.slice(0,5000);  // cap
  try{P('iss8_audit',auditTrail);}catch{}
  // Mirror to IndexedDB so it survives a localStorage wipe
  if(typeof idbPut==='function') idbPut('meta',auditTrail.slice(0,500),'auditRecent');
}

// ══════════════════════════════════════════════════════════
// TRIPLE STORAGE — protect against load-shedding data loss
// Layer 1: localStorage (instant, size-limited)
// Layer 2: IndexedDB   (robust, unlimited, survives cache clear)
// Layer 3: Disk file   (File System Access API or Electron fs)
// On startup: compare all three, use the most complete set.
// ══════════════════════════════════════════════════════════
let _idb = null;
let _backupDir = null;  // FileSystemDirectoryHandle (browser)
let _lastSaved = null;  // timestamp of last successful write

function openIDB(){
  return new Promise(res=>{
    if(!window.indexedDB){return res(null);}
    const r = indexedDB.open('iss_wb_v8', 2);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('txs'))
        d.createObjectStore('txs', {keyPath:'id'});
      if(!d.objectStoreNames.contains('meta'))
        d.createObjectStore('meta');
    };
    r.onsuccess = e=>{ _idb = e.target.result; res(_idb); };
    r.onerror   = ()=>res(null);
  });
}
function idbPut(store, val, key){
  if(!_idb) return;
  try{ _idb.transaction(store,'readwrite').objectStore(store).put(val, key||undefined); }catch{}
}
// Clear an entire IndexedDB store. Needed when wiping data — without this the
// startup power-cut recovery finds the old records still in IndexedDB and
// restores them, silently undoing the wipe.
function idbClear(store){
  return new Promise(res=>{
    if(!_idb) return res(false);
    try{
      const r=_idb.transaction(store,'readwrite').objectStore(store).clear();
      r.onsuccess = ()=>res(true);
      r.onerror   = ()=>res(false);
    }catch{ res(false); }
  });
}
function idbGetAll(store){
  return new Promise(res=>{
    if(!_idb) return res([]);
    try{
      const r = _idb.transaction(store).objectStore(store).getAll();
      r.onsuccess = ()=>res(r.result||[]);
      r.onerror   = ()=>res([]);
    }catch{res([]);}
  });
}
function idbGet(store, key){
  return new Promise(res=>{
    if(!_idb) return res(null);
    try{
      const r = _idb.transaction(store).objectStore(store).get(key);
      r.onsuccess = ()=>res(r.result||null);
      r.onerror   = ()=>res(null);
    }catch{res(null);}
  });
}

// Write a single tx to IndexedDB immediately
function idbPutTx(tx){ idbPut('txs', tx); }

// File System Access API — user picks a folder ONCE, handle persisted
async function pickBackupFolder(){
  if(!window.showDirectoryPicker){
    toast('Disk backup needs Chrome/Edge desktop browser or the EXE app','error');
    return false;
  }
  try{
    const dir = await window.showDirectoryPicker({mode:'readwrite',id:'iss-backup'});
    _backupDir = dir;
    // Persist handle in IndexedDB so it survives page refresh
    idbPut('meta', dir, 'backupDir');
    toast('Backup folder set ✓ — auto-saving after every transaction','success',4000);
    return true;
  }catch(e){
    if(e.name !== 'AbortError') toast('Could not access folder: '+e.message,'error');
    return false;
  }
}
async function restoreBackupHandle(){
  const dir = await idbGet('meta','backupDir');
  if(!dir) return;
  try{
    // Check we still have permission
    const perm = await dir.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){ _backupDir = dir; return; }
    const req  = await dir.requestPermission({mode:'readwrite'});
    if(req === 'granted') _backupDir = dir;
  }catch{}
}
async function writeBackupFile(jsonStr){
  if(!_backupDir) return false;
  try{
    const d   = new Date();
    const pad = x=>String(x).padStart(2,'0');
    const dateStr = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    // Always overwrite Latest (fast read after power cut)
    const latest = await _backupDir.getFileHandle('ISS-Backup-Latest.json',{create:true});
    const wl = await latest.createWritable();
    await wl.write(jsonStr); await wl.close();
    // One dated file per day (keeps 30 days history)
    const dated = await _backupDir.getFileHandle('ISS-Backup-'+dateStr+'.json',{create:true});
    const wd = await dated.createWritable();
    await wd.write(jsonStr); await wd.close();
    return true;
  }catch(e){
    console.warn('Backup write failed:',e.message);
    return false;
  }
}

// ── THE MAIN BACKUP FUNCTION — called after every transaction ──
async function autoBackup(why){
  // Build snapshot
  const snap = {
    version:'8.0', savedAt:new Date().toISOString(),
    txCount:txs.length, pendingCount:pending.length,
    txs, pending, orders, db,
  };
  const json = JSON.stringify(snap);

  // L1 — localStorage (already saved by saveTxs/savePend)
  // L2 — IndexedDB: save every tx individually (survives localStorage wipe)
  if(_idb){
    try{
      const store = _idb.transaction('txs','readwrite').objectStore('txs');
      txs.forEach(t=>store.put(t));
    }catch{}
    idbPut('meta', snap.savedAt, 'lastSaved');
    idbPut('meta', snap.txCount, 'txCount');
  }

  // L3a — Disk file via File System Access API (browser)
  let diskOk = false;
  if(_backupDir) diskOk = await writeBackupFile(json);

  // L3b — Electron desktop: synchronous fs write (most reliable)
  if(window.issDesktop){
    try{
      await window.issDesktop.autoBackup(json);
      diskOk = true;
    }catch{}
  }

  // L3c — Electron sync folder (shared network, write tx individually)
  if(window.issDesktop && txs.length){
    window.issDesktop.syncWrite(txs[0]).catch(()=>{});
  }

  // Update the status badge
  _lastSaved = new Date();
  updateSavedBadge(diskOk);
}

function updateSavedBadge(diskOk){
  const el = document.getElementById('saved-badge');
  if(!el) return;
  const t = _lastSaved ? _lastSaved.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}) : '—';
  el.textContent = (diskOk ? '💾 ' : '🖫 ') + t;
  el.title = diskOk ? 'Saved to localStorage + IndexedDB + disk' : 'Saved to localStorage + IndexedDB (no disk folder set)';
  el.style.color = diskOk ? '#4ADE80' : '#FCD34D';
}

// ── STARTUP RECOVERY — after a power cut, find the best data ──
async function recoverData(){
  // Get counts from all layers
  const lsCount  = txs.length;
  const idbTxs   = await idbGetAll('txs');
  const idbCount = idbTxs.length;

  if(idbCount > lsCount){
    // IndexedDB has MORE data — localStorage was wiped or incomplete
    txs = idbTxs.sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));
    P(K.txs, txs);  // repopulate localStorage
    const diff = idbCount - lsCount;
    if(diff > 0){ toast('⚡ Recovered '+diff+' transaction'+(diff>1?'s':'')+' after power cut','info',6000); if(typeof auditLog==='function') auditLog('recover','tx','','Power-cut recovery: restored '+diff+' transactions from IndexedDB'); }
  } else if(idbCount < lsCount && _idb){
    // localStorage has more — sync missing ones into IndexedDB
    txs.forEach(t=>idbPutTx(t));
  }
}

// ── Weight division rounding ──────────────────────────────────────
// Some indicators read in 1 kg steps but the ticket must be issued in coarser
// divisions (e.g. 20 kg). Set per bridge in Settings; blank = record the exact
// reading. Rounds to the NEAREST division, with an exact half going DOWN:
//   division 20 →  10 → 0 ,  12 → 20 ,  30 → 20 ,  32 → 40
function bridgeDivision(bridgeIdx){
  const b=(cfg.bridges||[])[bridgeIdx==null?activeBridge:bridgeIdx];
  const d=parseInt(b&&b.division);
  return (isFinite(d)&&d>1)?d:0;          // 0 or 1 = no rounding

function applyDivision(w, bridgeIdx){
  const n=Number(w);
  if(!isFinite(n)) return w;
  const d=bridgeDivision(bridgeIdx);
  if(!d) return Math.round(n);            // no division set — exact reading
  const sign=n<0?-1:1, a=Math.abs(n);
  return sign * Math.ceil(a/d - 0.5) * d; // nearest, exact half rounds down
}

/* A transaction's identity in the cloud. The ticket number is NOT unique
   across sites — Hillside and Primecoal both count from 001 — so the row id is
   what the backend keys on. Generated on this PC when the transaction starts,
   it also makes re-sending after a dropped connection idempotent: the retry
   updates the same row instead of creating a second one. */
function newRowId(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  try{
    const b=new Uint8Array(16); crypto.getRandomValues(b);
    b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
    const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }catch(e){}
  return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
/* Short code identifying this site, e.g. hillside / primecoal. Falls back to a
   slug of the site name so an install that was never configured still sends
   something usable rather than an empty string. */
function siteCode(){
  const c=(cfg.siteCode||'').trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'');
  if(c) return c;
  const n=(cfg.siteName||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return n||'unset';
}
function stampTx(tx){
  if(!tx.rowId) tx.rowId=newRowId();
  tx.site=siteCode();

}
/* One-off repair for records captured before 9.2.0 so historical tickets sync
   under the same rules as new ones. */
function migrateTxKeys(){
  let n=0;
  for(const t of txs){
    if(!t.rowId){ t.rowId=newRowId(); n++; }
    if(!t.site){ t.site=siteCode(); n++; }
  }
  for(const p of pending){
    if(!p.rowId){ p.rowId=newRowId(); n++; }
    if(!p.site){ p.site=siteCode(); n++; }
  }
  if(n){ saveTxs(); try{ P(K.pend,pending); }catch(e){} Debug.log('tx keys: filled '+n+' missing site/rowId'); }
}

/* ════ White-label branding ════
   A signed iss-brand.json (created in the Brand Builder) sets the logo,
   colours and company details with no code edits. The signature deters copying
   and hand-editing — only the Brand Builder (which holds the key) can sign one. */
const BRAND_SECRET='ISS-BRAND-7731';
// Brand packs signed before the rebrand used the old key. Keep validating them
// so existing client installs don't lose their branding on upgrade.
const LEGACY_BRAND_SECRETS=['NS-BRAND-7731'];
function brandHash(str,secret){
  const s=(secret||BRAND_SECRET)+'\u241f'+(str||'');
  let h1=0x811c9dc5,h2=0x1000193;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);
    h1=(h1^c)>>>0; h1=Math.imul(h1,0x01000193)>>>0;
    h2=(h2+c)>>>0; h2=Math.imul(h2,0x85ebca6b)>>>0;}
  return ((h1^((h2<<13)|(h2>>>19)))>>>0).toString(16).toUpperCase().padStart(8,'0');
}
function brandCanon(b){
  const c=b.colors||{};
  return [b.v||1,b.company,b.tagline,b.address,b.phone,b.email,b.reg,b.ticketFooter,
          c.primary,c.accent,c.dark,b.licensedTo,b.logo].map(x=>x==null?'':String(x)).join('\u241f');
}
function brandValid(b){
  if(!b||!b.sig) return false;
  const canon=brandCanon(b);
  if(b.sig===brandHash(canon)) return true;
  return LEGACY_BRAND_SECRETS.some(k=>b.sig===brandHash(canon,k));
}
let _brand=null;
function applyBrand(b){

  _brand=b; window._brand=b;

function orderLoadedKg(orderId){
  return txs.filter(t=>t.orderId===orderId).reduce((s,t)=>s+(t.net||0),0);

function orderRemainingKg(o){
  if(!o||!o.targetKg) return null;

// Deactivates an order as soon as its target tonnage is met/exceeded.
function checkOrderCompletion(orderId){
  if(!orderId) return;
  const o=orders.find(x=>x.id===orderId);
  if(!o||!o.targetKg||o.active===false) return;
  const loaded=orderLoadedKg(orderId);
  if(loaded>=o.targetKg){
    o.active=false; o.completedAt=nowISO(); o.completedKg=loaded;
    saveOrders();
    auditLog('order-complete','order',o.no,'Target '+(o.targetKg/1000).toFixed(2)+'t reached ('+(loaded/1000).toFixed(2)+'t) - order deactivated');

  if(cfg.overridePassHash && await verifyHash(v,cfg.overridePassHash)) return true;

// ── SERIAL ──────────────────────────────────────
// ══════════════════════════════════════════════════════════
// SERIAL PORT — pair ONCE (master), then auto-open forever.
//
// Web Serial remembers granted ports via navigator.serial.getPorts().
// We tag each bridge with the device's USB vendor/product ID so on
// startup we silently re-open the SAME physical indicator without any
// popup. The popup (requestPort) only happens when the master pairs.
// ══════════════════════════════════════════════════════════

// Open an already-granted SerialPort object (no popup)
// ══════════════════════════════════════════════════════════
// NATIVE SERIAL (Electron EXE) — the bulletproof path.
//
// When running in the desktop app, the COM port is held OPEN by
// the main process at the OS level. It is set ONCE by the master,
// remembered forever, reopened on every launch, and survives
// renderer reloads and cable drops — NEVER needs unplugging.
//
// The browser/PWA build automatically falls back to Web Serial.
// ══════════════════════════════════════════════════════════
let _nativeSerial=false;
let _serialErr=null;
let _nativeBound=false;
let _nativeRawBuf=['',''];
let _lastSerialData=[0,0];
let _silentWarned=[false,false];

async function initNativeSerial(){
  if(!window.issDesktop || !window.issDesktop.serialAvailable) return false;
  try{ _nativeSerial = await window.issDesktop.serialAvailable(); }catch{ _nativeSerial=false; }
  if(!_nativeSerial){ try{ _serialErr=await window.issDesktop.serialError(); }catch{} return false; }
  if(_nativeBound) return true;
  _nativeBound=true;

  // Live weight lines pushed from main process
  window.issDesktop.onSerialData(({bi,line})=>{ _lastSerialData[bi]=Date.now(); feedSerial(bi, line+'\n'); });
  // Raw chunks from native port → single feed path (parse + monitor + weight)
  window.issDesktop.onSerialRaw(({bi,data})=>{
    _lastSerialData[bi]=Date.now();
    feedSerial(bi, data);
  });
  // Status changes
  window.issDesktop.onSerialStatus(({bi,status,path,detail})=>{
    if(status==='open'){
      bState[bi].state='connected';
      _lastSerialData[bi]=0; _silentWarned[bi]=false;
      stopSim(bi);
      setPill('● Live'+(path?' '+path:''),'rgba(27,122,67,.15)','#4ADE80',bi);
      // Warn if the port opens but the indicator sends nothing within 4s
      setTimeout(()=>{
        if(_nativeSerial && !_lastSerialData[bi] && !_silentWarned[bi]){
          _silentWarned[bi]=true;
          toast('Port open on '+(path||'COM')+' but no data from indicator. Check baud rate, cable TX/GND wiring, and that the indicator is in continuous-print mode.','error',9000);
          setPill('⚠ Open · no data','rgba(217,119,6,.15)','#FBBF24',bi);
        }
      },4000);
    }else if(status==='closed'||status==='error'){
      if(bState[bi].state==='connected'){ bState[bi].state='disconnected'; startSim(bi); }
      setPill('◌ Reconnecting…','rgba(220,38,38,.12)','#FCA5A5',bi);
    }
  });
  // Ongoing silent-port monitor: if data stops for 6s while 'open', flag it
  setInterval(()=>{
    if(!_nativeSerial) return;
    for(let bi=0;bi<2;bi++){
      if(bState[bi].state==='connected' && _lastSerialData[bi] && (Date.now()-_lastSerialData[bi]>6000)){
        if(bi===activeBridge) setPill('⚠ No data 6s','rgba(217,119,6,.15)','#FBBF24',bi);
      }
    }
  },3000);
  return true;
}

async function openSerialPort(port,bi){
  const br=bState[bi],bc=cfg.bridges[bi];
  if(_rawRunning){ await rawDisconnect(); }
  if(br.serial){ await disconnectSerial(bi); await new Promise(r=>setTimeout(r,200)); }
  stopSim(bi);
  setPill('◌ Connecting…','rgba(255,204,0,.15)','#FCD34D',bi);
  let opened=false,lastErr=null;
  for(let a=0;a<4&&!opened;a++){
    try{
      await port.open({baudRate:parseInt(bc.baud)||9600,dataBits:parseInt(bc.dataBits)||8,stopBits:1,parity:bc.parity||'none'});

    }catch(e){
      lastErr=e;
      // if it's already open by us, treat as success
      if(/already open/i.test(e.message||'')){ opened=true; break; }
      await new Promise(r=>setTimeout(r,400));
    }
  }
  if(!opened) throw lastErr||new Error('open failed');
  br.serial=port; br.state='connected';
  setPill('● Live','rgba(27,122,67,.15)','#4ADE80',bi);
  readSerial(port,bi);
  return true;
}

// MASTER: pair a port — shows the chooser ONCE, then remembers it.
async function connectSerial(bi){
  // In the desktop EXE, use the bulletproof native serial path
  if(window.issDesktop && _nativeSerial){ return connectSerialNative(bi); }
  if(!('serial' in navigator)){toast('Web Serial not available — run the ISS Weighbridge desktop app','error');return;}
  // Only the master may CHANGE the paired port. Clerks just get the
  // already-paired live connection (handled by autoOpenSavedPorts).
  if(session?.role!=='master'){
    toast('Only Master can set the serial port. It opens automatically in live mode.','error',5000);
    return;
  }
  const br=bState[bi],bc=cfg.bridges[bi];
  try{
    const port=await navigator.serial.requestPort();   // the ONE popup
    // Remember which physical device this is (USB IDs)
    try{
      const info=port.getInfo?.();
      if(info){ bc.usbVendorId=info.usbVendorId; bc.usbProductId=info.usbProductId; saveCfg(); }
    }catch{}
    bc.paired=true; saveCfg();
    await openSerialPort(port,bi);
    auditLog('config','settings','bridge'+bi,'Paired serial port for '+(bc.name||'Bridge '+(bi+1)));
    toast((bc.name||'Bridge')+' paired ✓ — will auto-open from now on','success',5000);
  }catch(e){
    if(e.name==='AbortError'){ startSim(bi); return; }
    if(/already open|in use|not available|failed to open/i.test(e.message||''))
      toast('Port busy — unplug/replug USB or close other programs using it','error',6000);
    else toast('Connect failed: '+(e.message||e.name),'error');
    startSim(bi);
  }
}

// STARTUP: silently re-open every paired bridge, no popup.
// Matches saved USB vendor/product IDs to a granted port.
async function autoOpenSavedPorts(){
  if(!('serial' in navigator)) return;
  let granted=[];
  try{ granted=await navigator.serial.getPorts(); }catch{ return; }
  if(!granted.length) return;
  for(let bi=0;bi<cfg.bridges.length;bi++){
    const bc=cfg.bridges[bi];
    if(!bc.paired) continue;
    if(bc.src && /^wss?:/.test(bc.src)) continue;   // this bridge is a WeighBox, skip
    // Find the granted port whose USB IDs match this bridge
    let match=null;
    for(const p of granted){
      let info={}; try{ info=p.getInfo?.()||{}; }catch{}
      if(bc.usbVendorId==null || (info.usbVendorId===bc.usbVendorId && info.usbProductId===bc.usbProductId)){
        match=p; break;
      }
    }
    // Fallback: if only one device is granted and bridge has no stored IDs, use it
    if(!match && granted.length===1 && bc.usbVendorId==null) match=granted[0];
    if(match){
      try{
        await openSerialPort(match,bi);
        toast((bc.name||'Bridge '+(bi+1))+' live ✓','success',2500);
      }catch(e){
        // device not plugged in yet — keep simulation, retry later
        startSim(bi);
      }
    }
  }
}

// Watchdog: if a paired bridge drops (cable knocked), keep trying to
// silently re-open it every 8s — no popup, no operator action.
let _serialWatchdog=null, _serialEvtBound=false;
function startSerialWatchdog(){
  if(_serialWatchdog) clearInterval(_serialWatchdog);
  _serialWatchdog=setInterval(async()=>{
    if(!('serial' in navigator)) return;
    for(let bi=0;bi<cfg.bridges.length;bi++){
      const bc=cfg.bridges[bi], br=bState[bi];
      if(!bc.paired) continue;
      if(bc.src && /^wss?:/.test(bc.src)) continue;
      if(br.state==='connected') continue;   // already live
      // try to re-open from granted ports
      try{
        const granted=await navigator.serial.getPorts();
        let match=null;
        for(const p of granted){
          let info={}; try{info=p.getInfo?.()||{};}catch{}
          if(bc.usbVendorId==null || (info.usbVendorId===bc.usbVendorId && info.usbProductId===bc.usbProductId)){ match=p; break; }
        }
        if(!match && granted.length===1 && bc.usbVendorId==null) match=granted[0];
        if(match){ await openSerialPort(match,bi); toast((bc.name||'Bridge '+(bi+1))+' reconnected ✓','success',2000); }
      }catch{}
    }
  },8000);
}
async function readSerial(port,bi){
  const br=bState[bi],bc=cfg.bridges[bi];
  const dec=new TextDecoder(); let buf='';
  try{
    br.reader=port.readable.getReader();
    while(true){
      const {value,done}=await br.reader.read();
      if(done)break;
      buf+=dec.decode(value);
      const lines=buf.split('\n'); buf=lines.pop();
      for(const ln of lines){const w=parseRaw(ln,bc);if(w!==null){br.live=w;if(bi===activeBridge)updateWeight(w);}}
    }
  }catch(e){
    // expected when we cancel the reader during disconnect
  }finally{
    // ALWAYS release the lock so the port can be reopened
    try{ br.reader&&br.reader.releaseLock(); }catch{}
    br.reader=null;
  }
}

// SIMPLE SERIAL — the only path that matters.

    .replace(/<ENQ>/gi,'\x05').replace(/<STX>/gi,'\x02').replace(/<ETX>/gi,'\x03');

    setMon(bi,'Opening '+path+' @ '+baud+'…');
    const r=await window.issDesktop.serialOpen(bi,{path,baud,dataBits:8,parity:'none',stopBits:1,pollCmd:bc.pollCmd||'',pollMs:bc.pollMs||1000});
    if(r&&r.ok){
      auditLog('config','settings','bridge'+bi,'Connected '+path+' @ '+baud);
      toast((bc.name||'Bridge '+(bi+1))+' connecting on '+path,'success');
    }else{
      setMon(bi,'ERROR: '+(r?.error||'could not open'));
      toast('Could not open '+path+': '+(r?.error||'unknown'),'error',6000);
    }
    return;
  }

  // ── Browser Web Serial fallback ──
  if(!('serial' in navigator)){ toast('Run the desktop EXE for serial, or use Chrome/Edge','error'); return; }
  try{
    const port=await navigator.serial.requestPort();
    await port.open({baudRate:parseInt(baud)||9600});
    bc.paired=true; saveCfg();
    bState[bi].serial=port; bState[bi].state='connected';
    stopSim(bi);
    setPill('● Live','rgba(27,122,67,.15)','#4ADE80',bi);
    readBrowserSerial(port,bi);
    // Browser polling for demand-mode indicators
    if(bc.pollCmd){
      try{
        const enc=new TextEncoder();
        const cmd=expandPoll(bc.pollCmd);
        const writer=port.writable.getWriter();
        await writer.write(enc.encode(cmd)); writer.releaseLock();
        if(_browserPoll[bi]) clearInterval(_browserPoll[bi]);
        _browserPoll[bi]=setInterval(async()=>{
          try{ const w=port.writable.getWriter(); await w.write(enc.encode(cmd)); w.releaseLock(); }catch{}
        }, parseInt(bc.pollMs)||1000);
      }catch{}
    }
    toast((bc.name||'Bridge '+(bi+1))+' live','success');
  }catch(e){
    if(e.name!=='AbortError') toast('Open failed: '+e.message,'error');
  }
}

async function readBrowserSerial(port,bi){
  const dec=new TextDecoder();
  try{
    while(port.readable){
      const reader=port.readable.getReader();
      try{
        while(true){
          const {value,done}=await reader.read();
          if(done) break;
          feedSerial(bi, dec.decode(value,{stream:true}));
        }
      }catch(e){ break; }
      finally{ reader.releaseLock(); }
    }
  }catch(e){}
}

async function stopBridge(bi){
  const bc=cfg.bridges[bi];
  bc.paired=false; delete bc.comPath; saveCfg();
  if(_browserPoll[bi]){ clearInterval(_browserPoll[bi]); _browserPoll[bi]=null; }
  if(window.issDesktop && _nativeSerial){ await window.issDesktop.serialClose(bi); }
  if(bState[bi].serial){ try{ await bState[bi].serial.close(); }catch{} bState[bi].serial=null; }
  bState[bi].state='sim'; startSim(bi);
  setMon(bi,'Stopped.');
  toast('Bridge stopped','info');
}

// Central feed: raw text in → parse → update weight + monitor
function feedSerial(bi, data){
  _monBuf[bi]=(_monBuf[bi]+data);
  const parts=_monBuf[bi].split(/[\r\n\x02\x03]+/);
  _monBuf[bi]=parts.pop();
  for(const ln of parts){
    if(!ln.trim()) continue;
    processLine(bi, ln);
  }
  // ── Idle-flush: some indicators send a fixed frame with NO line break.
  // If the leftover buffer looks like a full reading and nothing else
  // arrives within 250ms, parse it anyway.
  if(_idleFlush[bi]) clearTimeout(_idleFlush[bi]);
  if(_monBuf[bi].length>=4){
    _idleFlush[bi]=setTimeout(()=>{
      const leftover=_monBuf[bi];
      if(leftover.length>=4){
        processLine(bi, leftover);
        _monBuf[bi]='';
      }
    },250);
  }
  if(_monBuf[bi].length>300) _monBuf[bi]='';
}
function processLine(bi, ln){
  const bc=cfg.bridges[bi];
  const nums=numTokens(ln).map(t=>t.val);
  _deckLive[bi]=nums;
  if(_deckLearn[bi]) deckLearnTick(bi, nums);

  let w;
  if(isMulti(bc)){
    const d=parseDecks(nums, bc);
    bState[bi].decks=d.decks; bState[bi].deckSum=d.sum; bState[bi].deckAgrees=d.agrees;
    // Nothing mapped yet: fall back to the single-deck parser so a half-set-up
    // bridge still shows a weight instead of going dead.
    w = d.weight!==null && d.weight!==undefined ? d.weight : parseRaw(ln, bc);
  }else{
    bState[bi].decks=[]; bState[bi].deckSum=null; bState[bi].deckAgrees=null;
    w=parseRaw(ln, bc);
  }

  showMonLine(bi, ln, w);
  if(w!==null){
    bState[bi].live=w; bState[bi].state='connected';
    if(bi===activeBridge){ updateWeight(w); renderDeckBar(); }
  }
  if(isMulti(bc)) refreshDeckSetupThrottled(bi);
}
function refreshDeckSetupThrottled(bi){
  const now=Date.now();
  if(now-_deckFieldsPaint<400) return;
  _deckFieldsPaint=now;
  if(document.getElementById('dkset'+bi)) renderDeckSetup(bi);
}

function setMon(bi,msg){
  const m=document.getElementById('mon'+bi);
  if(m) m.innerHTML='<div style="color:#6a86a8">'+esc(msg)+'</div>';
}
let _monLines=[[],[]];
function showMonLine(bi, ln, w){
  _monLines[bi].unshift({ln,w});
  if(_monLines[bi].length>8) _monLines[bi].pop();
  const m=document.getElementById('mon'+bi);
  if(m){
    m.innerHTML=_monLines[bi].map((x,i)=>
      `<div style="${i===0?'color:#7CD992':'color:#4a6a52'}">${esc(x.ln)}${x.w!==null?' <span style="color:#FBBF24">→ '+fmt(x.w)+'</span>':''}</div>`
    ).join('');
  }
  const d=document.getElementById('dec'+bi);
  if(d && w!==null) d.textContent=fmt(w)+' '+(cfg.weightUnit||'kg');
}


/* ══════════════════════════════════════════════════════════════════════
   MULTI-DECK SUPPORT
   Some indicators send each deck's weight plus the gross in one string:
     #<d1>kg,NUL<d2>kg,NUL<d3>kg,NUL<d4>kg,NUL<status><gross>kg LF CR NUL
   Single-deck bridges are untouched — they keep using parseRaw().
   ══════════════════════════════════════════════════════════════════════ */

const DECK_SLOTS=[
  {k:'d1',l:'Deck 1',c:'#F2A93B'},{k:'d2',l:'Deck 2',c:'#2FB170'},
  {k:'d3',l:'Deck 3',c:'#B98BFF'},{k:'d4',l:'Deck 4',c:'#FF7A6B'}];
const GROSS_SLOT={k:'gross',l:'Gross',c:'#29ABE2'};
function deckSlots(bc){ return DECK_SLOTS.slice(0,Math.max(2,Math.min(4,parseInt(bc&&bc.deckCount)||4))); }
function allDeckSlots(bc){ return deckSlots(bc).concat([GROSS_SLOT]); }
function slotByKey(k){ return k==='gross'?GROSS_SLOT:DECK_SLOTS.find(s=>s.k===k); }
function isMulti(bc){ return !!(bc && bc.deckMode==='multi'); }

let _deckLive=[[],[]];        // last numbers seen per bridge
let _deckLearn=[null,null];   // learn-a-deck state per bridge
let _deckPaint=0, _deckFieldsPaint=0;

/* ONE tokeniser for everything. The field number the operator maps in
   Settings is an index into this array, so the mapper and the parser must
   never disagree about what counts as a number. */
function numTokens(ln){
  if(ln==null) return [];
  const clean=String(ln).replace(/(\d),(\d)/g,'$1$2');   // 14,280 -> 14280
  const out=[];
  const re=/[-+]?\d[\d ]*\.?\d*/g; let m;
  while((m=re.exec(clean))!==null){
    const c=m[0].replace(/[^0-9.\-]/g,'');
    if(!c||c==='-'||c==='.') continue;
    const v=parseFloat(c);
    if(isFinite(v)) out.push({raw:m[0].trim(),val:v});
  }
  return out;
}

/* Which number is the gross? The one equal to the sum of the others.
   Only trustworthy when two or more of the others carry load — with a single
   deck loaded, that deck and the gross hold the same figure and nothing can
   separate them. Returns -1 when it cannot be decided yet. */
function deckSumIndex(nums){
  const n=nums.length, hits=[];
  for(let i=0;i<n;i++){
    let sum=0,loaded=0;
    for(let j=0;j<n;j++) if(j!==i){ sum+=nums[j]; if(Math.abs(nums[j])>1) loaded++; }
    if(loaded<2) continue;
    if(Math.abs(sum-nums[i])/Math.max(Math.abs(nums[i]),1)<0.02) hits.push(i);
  }
  return hits.length===1?hits[0]:-1;
}

function parseDecks(nums, bc){
  const map=bc.deckMap||{}, tol=parseFloat(bc.deckTol)||0;
  const at=k=>{ const i=map[k]; return (i===undefined||nums[i]===undefined)?null:nums[i]; };
  const decks=deckSlots(bc).map(s=>at(s.k));
  const gross=at('gross');
  const got=decks.filter(v=>v!==null);
  const sum=got.length?got.reduce((a,v)=>a+v,0):null;
  // Gross is what gets ticketed. If it is not in the string, the decks added
  // up are the next best thing. If neither is mapped, fall through to the
  // ordinary single-deck parser so the bridge never goes dead.
  const weight = gross!==null ? gross : sum;
  return {decks, gross, sum,
          agrees:(gross===null||sum===null)?null:Math.abs(sum-gross)<=tol,
          weight};
}

/* ── Learn: load one deck, watch which number moves ── */
function deckLearnStart(bi, slot){
  const bc=cfg.bridges[bi]||{}, nums=_deckLive[bi];
  if(!nums.length){ toast('No data yet — connect the indicator first','error'); return; }
  if(slot!=='gross' && (bc.deckMap||{}).gross===undefined && deckSumIndex(nums)<0){
    toast('Set Gross first — put load on two or more decks, then press Suggest','error',6000); return;
  }
  _deckLearn[bi]={slot, baseline:nums.slice(), best:-1, bestDelta:0, until:Date.now()+20000};
  toast('Learning '+slotByKey(slot).l+' — put a load on that deck now','info',6000);
  renderDeckSetup(bi);
}
function deckLearnTick(bi, nums){
  const L=_deckLearn[bi]; if(!L) return;
  const bc=cfg.bridges[bi]||{}, map=bc.deckMap||{};
  // The gross rises by exactly the load being added, so it would otherwise win
  // the "what moved most" contest every time.
  const gi = map.gross!==undefined ? map.gross : deckSumIndex(nums);
  for(let i=0;i<nums.length;i++){
    if(i===gi && L.slot!=='gross') continue;
    let taken=false;
    for(const k of Object.keys(map)) if(map[k]===i && k!==L.slot) taken=true;
    if(taken) continue;
    const d=Math.abs(nums[i]-(L.baseline[i]||0));
    if(d>L.bestDelta){ L.bestDelta=d; L.best=i; }
  }
  if(Date.now()>L.until) deckLearnFinish(bi);
}
function deckLearnFinish(bi){
  const L=_deckLearn[bi]; if(!L) return;
  _deckLearn[bi]=null;
  const bc=cfg.bridges[bi]; if(!bc.deckMap) bc.deckMap={};
  if(L.best<0 || L.bestDelta<10){
    toast('Nothing moved enough to be sure — try again with a heavier load','error',5000);
    renderDeckSetup(bi); return;
  }
  for(const k of Object.keys(bc.deckMap)) if(bc.deckMap[k]===L.best) delete bc.deckMap[k];
  bc.deckMap[L.slot]=L.best; saveCfg();
  toast(slotByKey(L.slot).l+' = field '+L.best+' (moved '+fmt(Math.round(L.bestDelta))+')','success',5000);
  renderDeckSetup(bi);
}

function deckSuggest(bi){
  const bc=cfg.bridges[bi], nums=_deckLive[bi];
  if(!nums.length){ toast('No data yet — connect the indicator first','error'); return; }
  const gi=deckSumIndex(nums);
  bc.deckMap={};
  if(gi>=0){
    bc.deckMap.gross=gi;
    const ds=deckSlots(bc); let d=0;
    for(let i=0;i<nums.length && d<ds.length;i++){ if(i!==gi) bc.deckMap[ds[d++].k]=i; }
    toast('Field '+gi+' adds up to the others — set as Gross','success',5000);
  }else{
    const sl=allDeckSlots(bc);
    for(let i=0;i<Math.min(nums.length,sl.length);i++) bc.deckMap[sl[i].k]=i;
    toast('Cannot tell which field is the gross yet — load two or more decks and press Suggest again','error',7000);
  }
  saveCfg(); renderDeckSetup(bi);
}
function deckAssign(bi, i, k){
  const bc=cfg.bridges[bi]; if(!bc.deckMap) bc.deckMap={};
  for(const kk of Object.keys(bc.deckMap)) if(bc.deckMap[kk]===i) delete bc.deckMap[kk];
  if(k) bc.deckMap[k]=i;
  saveCfg(); renderDeckSetup(bi);
}
function deckClear(bi){ cfg.bridges[bi].deckMap={}; saveCfg(); renderDeckSetup(bi); }
function setDeckMode(bi,v){ setBridge(bi,'deckMode',v); renderSettings(); renderDeckBar(true); }
function setDeckCount(bi,v){ setBridge(bi,'deckCount',parseInt(v)||4); renderDeckSetup(bi); renderDeckBar(true); }
