}
function renderDeckSetup(bi){
  const el=document.getElementById('dkset'+bi);
  if(el) el.innerHTML=isMulti(cfg.bridges[bi])?deckSetupInner(bi):'';
}

function parseRaw(ln,bc){
  if(ln==null) return null;
  ln=String(ln);
  // ── MANUAL position mode (only if explicitly chosen via parser tool) ──
  if(bc && bc.manualParse && parseInt(bc.read)>0){
    const skip=parseInt(bc.skip)||0, read=parseInt(bc.read)||6;
    const sub=ln.substr(skip,read).replace(/[^0-9.\-]/g,'');
    const w=parseFloat(sub);
    return isFinite(w)?w:null;
  }
  // ── AUTO mode (default) — find the weight number in the line ──
  const toks=numTokens(ln);
  if(!toks.length) return null;
  let best=null, bestLen=0;
  for(const t of toks){
    // pick the LONGEST numeric token — that's the weight, not a status digit
    const digits=String(t.val).replace(/[^0-9]/g,'').length;
    if(digits>bestLen){ bestLen=digits; best=t.val; }
  }
  return best;
}
async function unpairBridge(bi){
  const bc=cfg.bridges[bi];
  if(!confirm('Unpair the serial port for '+(bc.name||'Bridge '+(bi+1))+'? You will need to pick it again.'))return;
  if(window.issDesktop && _nativeSerial){ await disconnectNative(bi); auditLog('config','settings','bridge'+bi,'Released serial port'); return; }
  bc.paired=false; delete bc.usbVendorId; delete bc.usbProductId; saveCfg();
  await disconnectSerial(bi);
  auditLog('config','settings','bridge'+bi,'Unpaired serial port');
  toast('Port unpaired','info');
  renderSettings();
}
async function disconnectSerial(bi){
  const br=bState[bi];
  try{
    if(br.reader){ await br.reader.cancel(); /* releaseLock handled in readSerial finally */ }
  }catch{}
  // wait for the read loop's finally{} to release the lock
  await new Promise(r=>setTimeout(r,120));
  try{
    if(br.serial){ await br.serial.close(); br.serial=null; }
  }catch(e){ console.warn('close',e.message); }
  br.reader=null;
  br.state='disconnected';
  // let the OS fully release the COM handle before any reopen
  await new Promise(r=>setTimeout(r,250));
  startSim(bi);
  toast('Disconnected','info');
}

// ══════════════════════════════════════════════════════════
// RAW SERIAL PARSER / READER — commissioning diagnostic
// Opens a COM port, shows live hex+ASCII of every byte the
// indicator sends, auto-detects the weight field, and lets
// you set skip/read for a bridge by clicking the data.
// ══════════════════════════════════════════════════════════
let _rawPort=null, _rawReader=null, _rawRunning=false, _rawBridge=0;
let _rawLines=[];          // recent decoded lines (raw strings)
let _rawByteBuf='';        // accumulator
let _rawFrozen=false;
let _rawCfg={baud:'9600',parity:'none',dataBits:8,stopBits:1};

let _parserNativeFeed=false;
function rawFeedNative(data){
  if(_rawFrozen) return;
  _rawByteBuf += data;
  const parts=_rawByteBuf.split(/[\r\n\x02\x03]+/);
  _rawByteBuf=parts.pop();
  for(const ln of parts){
    if(!ln.length) continue;
    _rawLatest=ln; _rawLines.unshift(ln);
    if(_rawLines.length>50) _rawLines.pop();
  }
  if(_rawByteBuf.length>200){ _rawByteBuf=''; }
  rawRenderMonitor(); rawRenderCharmap();
}
function openRawParser(bridgeIdx){
  _rawBridge = bridgeIdx ?? activeBridge;
  _rawLines=[]; _rawByteBuf=''; _rawFrozen=false;
  // preload settings from that bridge
  const bc=cfg.bridges[_rawBridge]||{};
  _rawCfg={baud:bc.baud||'9600',parity:bc.parity||'none',dataBits:bc.dataBits||8,stopBits:1};
  openModal('🔬 Raw Serial Parser — '+(cfg.bridges[_rawBridge]?.name||'Bridge '+(_rawBridge+1)), rawParserHTML());
}

let _rawSkip=0, _rawRead=6, _rawLatest='';

async function rawConnect(){
  // In the EXE, the native port is already streaming — just tap into it
  if(window.issDesktop && _nativeSerial){
    const bc=cfg.bridges[_rawBridge];
    if(!bc.comPath){
      toast('Set the serial port for this bridge first (Settings → Set Serial Port), then open the parser','error',6000);
      return;
    }
    _parserNativeFeed=true;
    _rawRunning=true;
    const btn=document.getElementById('raw-connect-btn');
    if(btn){ btn.textContent='⏹ Stop'; btn.className='btn btn-red btn-sm'; }
    toast('Reading live from '+bc.comPath+' (native)','success');
    return;
  }
  if(!('serial' in navigator)){
    toast('Web Serial needs Chrome/Edge desktop or the EXE app','error');
    return;
  }
  if(_rawRunning){ rawDisconnect(); return; }

  // ── CRITICAL: a COM port can only be held by ONE connection.
  // Release any live weighing connection on BOTH bridges first,
  // otherwise the OS reports "port not available".
  for(let i=0;i<bState.length;i++){
    if(bState[i].serial){
      try{ if(bState[i].reader) await bState[i].reader.cancel(); }catch{}
      await new Promise(r=>setTimeout(r,100));
      try{ if(bState[i].serial) await bState[i].serial.close(); }catch{}
      bState[i].reader=null; bState[i].serial=null; bState[i].state='sim';
    }
    stopSim(i);
  }
  // give Windows time to fully release the COM handle
  await new Promise(r=>setTimeout(r,300));

  try{
    _rawCfg.baud=document.getElementById('raw-baud').value;
    _rawCfg.parity=document.getElementById('raw-parity').value;
    _rawCfg.dataBits=parseInt(document.getElementById('raw-data').value)||8;

    // Reuse an already-granted port if possible (avoids double-open)
    let port=null;
    try{
      const ports=await navigator.serial.getPorts();
      // requestPort always shows the chooser; that's what we want here
    }catch{}
    _rawPort=await navigator.serial.requestPort();

    // Retry open up to 3× — the handle may still be settling
    let opened=false, lastErr=null;
    for(let attempt=0;attempt<3 && !opened;attempt++){
      try{
        await _rawPort.open({baudRate:parseInt(_rawCfg.baud),dataBits:_rawCfg.dataBits,stopBits:1,parity:_rawCfg.parity});
        opened=true;
      }catch(e){
        lastErr=e;
        // "port already open" or "failed to open" → wait and retry
        await new Promise(r=>setTimeout(r,400));
      }
    }
    if(!opened) throw lastErr||new Error('Could not open port');

    _rawRunning=true;
    const btn=document.getElementById('raw-connect-btn');
    if(btn){ btn.textContent='⏹ Close Port'; btn.className='btn btn-red btn-sm'; }
    rawRead();
    toast('Port open — reading raw data','success');
  }catch(e){
    _rawRunning=false;
    if(e.name==='AbortError'){ /* user cancelled chooser */ }
    else if(/already open|in use|not available|failed to open/i.test(e.message||'')){
      toast('Port busy — unplug/replug the USB cable, then try again','error',6000);
    }else{
      toast('Open failed: '+(e.message||e.name),'error',5000);
    }
    // restart sim so the app stays alive
    startSim(0); startSim(1);
  }
}

async function rawRead(){
  const dec=new TextDecoder();
  try{
    _rawReader=_rawPort.readable.getReader();
    while(_rawRunning){
      const {value,done}=await _rawReader.read();
      if(done)break;
      if(_rawFrozen) continue;
      const chunk=dec.decode(value,{stream:true});
      _rawByteBuf+=chunk;
      // Split on CR/LF — keep remainder. Also handle CR-only and LF-only.
      const parts=_rawByteBuf.split(/[\r\n]+/);
      _rawByteBuf=parts.pop();
      // Safety: if no line terminator after 200 chars, flush as one line
      if(_rawByteBuf.length>200){ parts.push(_rawByteBuf); _rawByteBuf=''; }
      for(const ln of parts){
        if(ln.length===0) continue;
        _rawLatest=ln;
        _rawLines.unshift(ln);
        if(_rawLines.length>50)_rawLines.pop();
      }
      if(parts.length){ rawRenderMonitor(); rawRenderCharmap(); }
    }
  }catch(e){
    // expected on cancel
  }finally{
    try{ _rawReader&&_rawReader.releaseLock(); }catch{}
    _rawReader=null;
  }
}

function rawRenderMonitor(){
  const el=document.getElementById('raw-monitor');
  if(!el)return;
  if(!_rawLines.length){el.innerHTML='<div style="color:#6a86a8">Port open — waiting for indicator to send…</div>';return;}
  el.innerHTML=_rawLines.slice(0,20).map((ln,i)=>{
    const hex=[...ln].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join(' ');
    const safe=esc(ln);
    return `<div style="${i===0?'color:#7CD992;font-weight:bold':'color:#4a6a52'};border-bottom:1px solid #1a2c40;padding:2px 0">
      <span style="color:#5a7a92">ASCII:</span> ${safe}
      <span style="color:#3a5a72;font-size:10px;display:block">HEX: ${hex}</span>
    </div>`;
  }).join('');
}

function rawRenderCharmap(){
  const el=document.getElementById('raw-charmap');
  if(!el)return;
  if(!_rawLatest){el.textContent='—';return;}
  el.innerHTML=[..._rawLatest].map((c,i)=>{
    const inField=i>=_rawSkip && i<_rawSkip+_rawRead;
    const isDigit=/[0-9.]/.test(c);
    const bg=inField?(isDigit?'#1B7A43':'#D97706'):'transparent';
    const col=inField?'#fff':(isDigit?'var(--navy)':'var(--text3)');
    const disp=c===' '?'·':esc(c);
    return `<span onclick="rawSetSkip(${i})" title="char ${i}" style="cursor:pointer;padding:1px 3px;border-radius:3px;background:${bg};color:${col}">${disp}</span>`;
  }).join('');
  // live decode
  rawUpdateDetected();
}

function rawSetSkip(i){
  _rawSkip=i;
  document.getElementById('raw-skip').textContent=_rawSkip;
  rawRenderCharmap();
}

function rawUpdateDetected(){
  const sub=_rawLatest.slice(_rawSkip,_rawSkip+_rawRead).replace(/[^0-9.\-]/g,'');
  const w=parseFloat(sub);
  const el=document.getElementById('raw-detected');
  if(el) el.textContent=isNaN(w)?'—':fmt(w)+' '+(cfg.weightUnit||'kg');
}

function rawAutoDetect(){
  if(!_rawLatest){toast('No data yet','error');return;}
  // Find the longest run of digits in the latest line
  let best={start:0,len:0};
  const re=/[0-9][0-9.\s]*[0-9]|[0-9]/g;
  let m;
  while((m=re.exec(_rawLatest))!==null){
    const len=m[0].replace(/\s/g,'').length;
    if(len>best.len) best={start:m.index,len:m[0].length};
  }
  if(best.len){
    _rawSkip=best.start;
    _rawRead=best.len;
    document.getElementById('raw-skip').textContent=_rawSkip;
    document.getElementById('raw-read').textContent=_rawRead;
    rawRenderCharmap();
    toast('Auto-detected weight field at position '+_rawSkip,'success');
  }else toast('No numeric field found in data','error');
}

function rawToggleFreeze(){
  _rawFrozen=!_rawFrozen;
  const b=document.getElementById('raw-freeze-btn');
  if(b) b.textContent=_rawFrozen?'▶ Resume':'⏸ Freeze';
}
function rawClear(){ _rawLines=[]; rawRenderMonitor(); }

async function rawDisconnect(){
  _rawRunning=false;
  _parserNativeFeed=false;                       // stops the read loop
  try{ if(_rawReader) await _rawReader.cancel(); }catch{}
  // wait for rawRead's finally{} to release the lock
  await new Promise(r=>setTimeout(r,120));
  try{ if(_rawPort){ await _rawPort.close(); _rawPort=null; } }catch(e){ console.warn('raw close',e.message); }
  _rawReader=null;
  const b=document.getElementById('raw-connect-btn');
  if(b){ b.textContent='🔌 Open Port'; b.className='btn btn-green btn-sm'; }
  // let the OS release the COM handle, then resume sim
  await new Promise(r=>setTimeout(r,250));
  if(!_rawRunning){ startSim(0); startSim(1); }
}
async function rawClose(){ await rawDisconnect(); closeModal(); }

async function rawApplyToBridge(){
  setBridge(_rawBridge,'skip',_rawSkip);
  setBridge(_rawBridge,'read',_rawRead);
  setBridge(_rawBridge,'baud',_rawCfg.baud);
  setBridge(_rawBridge,'parity',_rawCfg.parity);
  setBridge(_rawBridge,'dataBits',_rawCfg.dataBits);
  auditLog('config','settings','bridge'+_rawBridge,'Set parser: skip='+_rawSkip+' read='+_rawRead+' baud='+_rawCfg.baud);
  toast('Applied to '+(cfg.bridges[_rawBridge]?.name||'Bridge '+(_rawBridge+1))+' ✓','success');
  await rawDisconnect();
  closeModal();
  if(currentTab==='settings') renderSettings();
}

// Connect to a WeighBox WebSocket (from box or manually entered URL)
function connectBox(url, bi){
  bi = bi ?? activeBridge;
  if(!url) return;
  disconnectBox(bi);
  stopSim(bi);
  try{
    const sock = new WebSocket(url);
    boxSocks[bi] = sock;
    sock.onopen = () => {
      setPill('📦 WeighBox live','rgba(27,122,67,.15)','#4ADE80', bi);
      toast('WeighBox connected on Bridge '+(bi+1),'success');
      sock.send(JSON.stringify({cmd:'ping'}));
    };
    sock.onmessage = e => {
      try{
        const d = JSON.parse(e.data);
        // ── Live weight update from box
        if(d.weight != null || d.kg != null){
          const w = parseFloat(d.weight ?? d.kg) || 0;
          bState[bi].live = w;
          if(d.box_name) cfg.bridges[bi].name = d.box_name;
          if(bi === activeBridge) updateWeight(w);
          boxInfo[bi] = d;
          // Update pill with box ID
          const lbl = (d.box_name||('Box '+(bi+1))) + (d.scale_ok?' ●':' ○');
          setPill('📦 '+lbl,'rgba(27,122,67,.15)','#4ADE80', bi);
        }
        // ── Remote transaction from another box on the network (UDP relay)
        if(d.cmd === 'remote_tx' && d.tx){
          mergeRemoteTx(d.tx, d.from_box);
        }
      }catch{}
    };
    sock.onclose = () => {
      setPill('◌ Box disconnected','rgba(220,38,38,.15)','#FCA5A5', bi);
      startSim(bi);
      // Auto-reconnect after 5s
      clearTimeout(boxReconnTimers[bi]);
      boxReconnTimers[bi] = setTimeout(() => connectBox(url, bi), 5000);
    };
    sock.onerror = () => {};
  }catch(e){ toast('Box connect error: '+e.message,'error'); startSim(bi); }
}

function disconnectBox(bi){
  clearTimeout(boxReconnTimers[bi]);
  boxReconnTimers[bi] = null;
  if(boxSocks[bi]){ try{ boxSocks[bi].close(); }catch{} boxSocks[bi]=null; }
}

// Tell the box about a completed transaction → it relays to all other boxes via UDP
function syncTxToBox(tx){
  boxSocks.forEach(sock => {
    if(sock && sock.readyState === WebSocket.OPEN){
      sock.send(JSON.stringify({cmd:'sync_tx', tx}));
    }
  });
  // Also push to Electron desktop sync if available
  if(window.issDesktop) window.issDesktop.syncWrite(tx).catch(()=>{});
}

// Merge a transaction that arrived from another box
function mergeRemoteTx(txData, fromBox){
  try{
    const rt = typeof txData === 'string' ? JSON.parse(txData) : txData;
    if(!rt || !rt.id) return;
    // Already have it?
    if(txs.find(t => t.id === rt.id)) return;
    txs.unshift(rt);
    // If it was pending on our side, remove from pending
    pending = pending.filter(p => p.vehicleReg !== rt.vehicleReg);
    saveTxs(); savePend();
    updateWBCount();
    toast('🔄 Synced from Box '+(fromBox||'?')+': '+rt.vehicleReg+' — '+fmt(rt.net||0)+' kg','info');
    if(currentTab==='dashboard') renderDash();
    if(currentTab==='records') renderRecords();
  }catch(e){ console.error('mergeRemoteTx',e); }
}

// Scan the local network for ISS WeighBox devices via /info endpoint
// Tries common IPs: 192.168.x.1 (gateway/AP) and mDNS hostnames
async function scanForBoxes(){
  if(window.issDesktop) return [];   // offline EXE: native serial only, no network scan
  const results = [];
  const urls = [
    'http://192.168.4.1/info',      // ESP32 default AP IP
    'http://iss-wb-001.local/info', // mDNS box 001
    'http://iss-wb-002.local/info', // mDNS box 002
    'http://iss-wb-003.local/info', // mDNS box 003
  ];
  // Also try the current page's host if served from a box
  if(window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1'){
    urls.unshift('http://'+window.location.hostname+'/info');
  }
  await Promise.allSettled(urls.map(async url => {
    try{
      const r = await fetch(url, {signal: AbortSignal.timeout(1500)});
      if(r.ok){ const d = await r.json(); results.push({...d, url}); }
    }catch{}
  }));
  return results;
}

// Auto-connect: called on startup — if loaded FROM a box, connect immediately
function autoConnectBox(){
  // The WeighBox firmware injects window._ISS_BOX_WS with the WebSocket URL
  if(window._ISS_BOX_WS){
    toast('📦 WeighBox detected — connecting…','info');
    connectBox(window._ISS_BOX_WS, 0);
    // Save it for future manual use
    if(!cfg.bridges[0].src) { cfg.bridges[0].src = window._ISS_BOX_WS; saveCfg(); }
    return;
  }
  // Also check if saved box URLs exist in config
  cfg.bridges.forEach((br, i) => {
    if(br.src && /^wss?:\/\//.test(br.src)){
      connectBox(br.src, i);
    }
  });
}

// ── Stable / in-motion detection ──
// Heuristic: reading is STABLE once it has stayed within MOTION_TOL of a
// reference value for SETTLE_MS; any larger jump marks IN MOTION and restarts
// the settle timer. Works for both live serial feeds and the simulator.
const MOTION_TOL=80, SETTLE_MS=700;
let _mRef=null,_mSince=0,_mStable=true;
function computeMotion(w){
  const now=(typeof performance!=='undefined'?performance.now():Date.now());
  if(_mRef===null){_mRef=w;_mSince=now;_mStable=false;return false;}
  if(Math.abs(w-_mRef)>MOTION_TOL){_mRef=w;_mSince=now;_mStable=false;}
  else if(now-_mSince>=SETTLE_MS){_mStable=true;}
  return _mStable;
}
function setMotion(stable){
  document.querySelectorAll('.ns-motion').forEach(el=>{
    el.classList.toggle('stable',stable);
    el.classList.toggle('motion',!stable);
    const l=el.querySelector('.ns-motion-lbl'); if(l) l.textContent=stable?'STABLE':'IN MOTION';
  });
}
function motionPill(){
  return `<span class="ns-motion ${_mStable?'stable':'motion'}"><span class="ns-dot"></span><span class="ns-motion-lbl">${_mStable?'STABLE':'IN MOTION'}</span></span>`;
}

function updateWeight(w){
  renderDeckBar();
  const u=cfg.weightUnit||'kg';
  document.getElementById('hdr-wt').textContent=Math.round(w);
  document.getElementById('wb-live').textContent=Math.round(w);
  const over=cfg.grossMax>0&&w>cfg.grossMax;
  document.getElementById('hdr-wt').classList.toggle('over',over);
  setMotion(computeMotion(Math.round(w)));
}

// ── WEIGHING ────────────────────────────────────
function cap1(){
  if(!activeDir){ toast('Pick Loading or Off Loading first','error'); return; }
  const w=applyDivision(bState[activeBridge].live, activeBridge);
  if(w<=0){toast('No weight on scale','error');return;}
  const reg=(document.getElementById('f-reg')?.value||'').trim().toUpperCase();
  if(!reg){toast('Enter vehicle registration first','error');document.getElementById('f-reg')?.focus();return;}
  const existing=pending.find(p=>p.vehicleReg===reg);   // any bridge — one truck, one weigh-in
  if(existing){toast(reg+' already on site with 1st weight','error');return;}
  const bc=cfg.bridges[activeBridge];
  activeTx.vehicleReg=reg;
  activeTx.direction=activeDir;                 // 'dispatch' (Loading) or 'receive' (Off Loading)
  activeTx.product=(document.getElementById('f-prod')?.value||'').trim();
  activeTx.customer=(document.getElementById('f-cust')?.value||'').trim();
  activeTx.transporter=(document.getElementById('f-trans')?.value||'').trim();
  activeTx.supplier=(document.getElementById('f-sup')?.value||'').trim();
  activeTx.destination=(document.getElementById('f-dest')?.value||'').trim();
  activeTx.driver=(document.getElementById('f-driver')?.value||'').trim();
  // Order field is now type-or-pick: value is the order NUMBER. If it matches an
  // existing order, keep that order's id for validation; otherwise store the
  // free-typed number and remember it for the report.
  const ordTyped=(document.getElementById('f-order')?.value||'').trim();
  const matchOrder=orders.find(o=>String(o.no)===ordTyped);
  activeTx.orderId=matchOrder?matchOrder.id:'';
  activeTx.orderNoManual=matchOrder?'':ordTyped;   // free-typed order number (no matching order record)
  // Batch Number / Dispatch Ticket Nr — one field, meaning depends on direction.
  const bd=(document.getElementById('f-batchdisp')?.value||'').trim();
  if(dirFieldIsDispatch(activeDir)){ activeTx.dispatchTicketNo=bd; activeTx.batchNo=''; }
  else { activeTx.batchNo=bd; activeTx.dispatchTicketNo=''; }
  activeTx.custom=(cfg.customFields||[]).filter(cf=>cf.id!=='cfBatch').map(cf=>({
    id:cf.id, label:cf.label, onTicket:cf.onTicket!==false,
    value:(document.getElementById('f-cf-'+cf.id)?.value||'').trim()
  })).filter(c=>c.value);
  // keep batch in the custom array too (as cfBatch) so existing report/ticket code still finds it
  if(activeTx.batchNo) activeTx.custom.push({id:'cfBatch',label:'Batch No',onTicket:true,value:activeTx.batchNo});
  activeTx.firstWeight=w;
  activeTx.firstWeightTime=nowISO();
  activeTx.bridge=activeBridge;
  activeTx.bridgeName=bc?.name||'Bridge '+(activeBridge+1);
  activeTx.operatorName=session?.name||'';
  // Order + fleet checks
  if(activeTx.orderId){
    const o=orders.find(x=>x.id===activeTx.orderId);
    if(o&&o.active===false){
      toast('⛔ Order '+o.no+' is closed (target tonnage reached)','error',5000);return;

    }

  pending.push({...activeTx,queuedAt:nowISO()});
  savePend();
  auditLog('weigh1','tx',activeTx.vehicleReg,'1st weight '+w+'kg on '+activeTx.bridgeName);
  updateWBCount();

  }).filter(c=>c.value);
  // mirror the batch into the custom array so ticket/report code still finds it

// ── ESC/POS raw thermal (proper cutter, no browser dialog) ──
async function escposPrint(tx){
  if(!('serial' in navigator)){ return false; }
  try{
    const port=await navigator.serial.requestPort();
    await port.open({baudRate:parseInt(cfg.escposBaud)||9600});
    const enc=new TextEncoder();
    const w=port.writable.getWriter();
    const ESC='\x1B', GS='\x1D';
    const u=cfg.weightUnit||'kg';
    const net=tx.net??Math.abs((tx.secondWeight||0)-(tx.firstWeight||0));
    let out='';
    out+=ESC+'@';                    // init
    out+=ESC+'a'+'\x01';            // center
    out+=ESC+'!'+'\x18';            // double height/width
    const T=cfg.ticket||{};
    if((T.companyName||'').trim()) out+=(T.companyName).trim()+'\n';
    out+=ESC+'!'+'\x00';            // normal
    { const g=k=>((T[k]||'').trim());
      if(g('vat'))     out+='VAT No: '+g('vat')+'\n';
      if(g('address')) out+=g('address')+'\n';
      if(g('reg'))     out+='Reg: '+g('reg')+'\n';
      if(g('phone'))   out+='Tel: '+g('phone')+'\n';
      if(g('email'))   out+=g('email')+'\n';
      if(g('tagline')) out+=g('tagline')+'\n'; }
    out+='--------------------------------\n';
    out+=ESC+'a'+'\x00';            // left
    const row=(l,v)=>l.padEnd(14)+String(v)+'\n';
    out+=ESC+'a'+'\x01'+ESC+'!'+'\x10'+tx.vehicleReg+'\n'+ESC+'!'+'\x00'+ESC+'a'+'\x00';
    out+='--------------------------------\n';
    out+=row('1st Weight',fmt(tx.firstWeight)+' '+u);
    out+=row('2nd Weight',fmt(tx.secondWeight)+' '+u);
    out+=ESC+'a'+'\x01'+ESC+'!'+'\x18'+'NET '+fmt(net)+' '+u+'\n'+ESC+'!'+'\x00'+ESC+'a'+'\x00';
    out+='--------------------------------\n';
    if(tx.product) out+=row('Product',tx.product);
    if(tx.customer)out+=row('Customer',tx.customer);
    if(tx.transporter)out+=row('Transporter',tx.transporter);
    if(tx.orderId) out+=row('Order',(orders.find(o=>o.id===tx.orderId)?.no)||tx.orderId);
    out+=row('Operator',tx.operatorName||'');
    out+=row('Date',fmtDT(tx.completedAt));
    out+='\n'+ESC+'a'+'\x01'+POWERED_BY+'\n\n\n';
    out+=GS+'V'+'\x42'+'\x00';     // partial cut
    await w.write(enc.encode(out));
    w.releaseLock();
    await port.close();
    return true;
  }catch(e){ console.warn('ESC/POS failed:',e.message); return false; }
}

// ══════════════════════════════════════════════════════════
// UNIFIED TICKET RENDERER — uses the ticket builder config.
// Larger, readable fonts. Templates: standard | compact | detailed.
// Always prints via the Windows DEFAULT printer (browser print).
// ══════════════════════════════════════════════════════════
// ── Ticket QR (receiving-side allocation) ──
// Encodes human-readable ticket info so the receiver can scan with any phone
// and allocate the truck to the correct offloading point. No server needed.
function nsQRSVG(text){
  if(typeof qrcode==='undefined') return '';
  let qr=null;
  // Prefer error-correction M, then L — FEWER modules = bigger squares = scans on
  // a thermal printer. (Q first made it needlessly dense.)
  for(const lvl of ['M','L','Q','H']){
    try{ const q=qrcode(0,lvl); q.addData(text); q.make(); qr=q; break; }catch(e){}
  }
  if(!qr) return '';
  const n=qr.getModuleCount();
  const q=4;                     // REQUIRED quiet zone — without it, scanners fail
  const sz=n+q*2;
  let d='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d+='M'+(c+q)+' '+(r+q)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+sz+' '+sz+'" shape-rendering="crispEdges" width="100%" height="100%">'+
         '<rect width="'+sz+'" height="'+sz+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function nsTicketQRText(tx){
  const u=cfg.weightUnit||'kg';
  const t=cfg.ticket||{};
  const net=tx.net??Math.abs((tx.secondWeight||0)-(tx.firstWeight||0));
  const ordNo=tx.orderId?((orders.find(o=>o.id===tx.orderId)?.no)||tx.orderId):'';
  // Cap each free-text field so the QR can't balloon in density (long customer/
  // transporter names would otherwise make it unscannable on thermal). Full,
  // untruncated detail is printed on the ticket itself.
  const cap=(v,n=24)=>{v=String(v||'').trim(); return v.length>n?v.slice(0,n-1)+'…':v;};
  const L=[];
  if((t.companyName||'').trim()) L.push(cap(t.companyName,28));
  L.push('Ticket '+(tx.id||''));
  L.push('Date '+fmtDT(tx.completedAt));
  L.push('Reg '+(tx.vehicleReg||''));
  if(ordNo)          L.push('Order '+cap(ordNo,20));
  if(tx.product)     L.push('Product '+cap(tx.product));
  if(tx.customer)    L.push('Customer '+cap(tx.customer));
  if(tx.transporter) L.push('Transporter '+cap(tx.transporter));
  if(tx.destination) L.push('Destination '+cap(tx.destination));
  L.push('Net '+fmt(net)+' '+u);
  return L.join('\n');
}
function nsTicketQRBlock(tx,t,px,accent){
  if(!t.showQR) return '';
  const svg=nsQRSVG(nsTicketQRText(tx));
  if(!svg) return '';
  const size=Math.max(175,px);   // floor: a QR under ~150px won't scan off thermal
  return `<div style="text-align:center;margin-top:10px">
    <div style="width:${size}px;height:${size}px;margin:0 auto">${svg}</div>
    <div style="font-size:10px;color:#666;margin-top:4px;font-family:'Segoe UI',Arial,sans-serif">Scan to allocate offloading point</div></div>`;
}

function renderTicket(tx,forceWidth){
  const t=Object.assign({},DEF_CFG.ticket,cfg.ticket||{});
  const u=cfg.weightUnit||'kg';
  const net=tx.net??Math.abs((tx.secondWeight||0)-(tx.firstWeight||0));
  const copies=Math.max(1,parseInt(cfg.copies)||1);
  const MONO=t.monoBlack!==false;
  const A=MONO?'#000':(t.accentColor||'#1A3A6B');
  const isA4=(forceWidth||t.paperWidth)==='A4';
  let fs=parseFloat(t.fontScale)||1;       // font multiplier
  if(t.template==='detailed') fs*=1.12;    // detailed = larger, more readable
  if(t.template==='compact')  fs*=0.92;    // compact = tighter
  const S=n=>Math.max(8,Math.round(n*fs)); // scale a px value (min 8px)
  const orderRef=tx.orderId?(orders.find(o=>o.id===tx.orderId)?.no||''):(tx.orderNoManual||'');

  // field rows respecting the on/off toggles
  const F=t.fields||{};
  const rowsData=[
    F.product     && ['Product',     tx.product],
    F.customer    && ['Customer',    tx.customer],
    F.transporter && ['Transporter', tx.transporter],
    F.supplier    && ['Supplier',    tx.supplier],
    F.destination && ['Destination', tx.destination],
    F.driver      && ['Driver',      tx.driver],
    F.order       && orderRef && ['Order', orderRef],
    txDirReport(tx) && ['Type', txDirReport(tx)],
    tx.dispatchTicketNo && ['Dispatch Ticket Nr', tx.dispatchTicketNo],
    ...((tx.custom||[]).filter(c=>c && c.value && c.onTicket!==false).map(c=>[c.label, c.value])),
  ].filter(r=>r && r[1]);

  // ── THERMAL / 80mm style (the readable redesign) ──
  function thermalBody(copyLbl){
    const detailRow=(l,v)=>`<tr>
      <td style="padding:${S(7)}px 0;color:#333;font-size:${S(15)}px;vertical-align:top;white-space:nowrap">${l}</td>
      <td style="padding:${S(7)}px 0;font-weight:700;font-size:${S(15)}px;text-align:right;padding-left:${S(10)}px">${esc(String(v))}</td></tr>`;
    const big=t.template==='compact'?S(30):S(38);
    return `
      ${ticketLogoHTML(t.template==='compact'?S(34):S(46))}
      <div style="text-align:center;margin-top:${S(6)}px">
        <div style="font-size:${S(16)}px;font-weight:900;color:${A};letter-spacing:.5px">${esc(t.companyName||'')}</div>
        ${t.vat?`<div style="font-size:${S(10)}px;color:#555"><b>VAT No:</b> ${esc(t.vat)}</div>`:''}
        ${t.address?`<div style="font-size:${S(11)}px;color:#555">${esc(t.address)}</div>`:''}
        ${t.reg?`<div style="font-size:${S(10)}px;color:#777">Reg: ${esc(t.reg)}</div>`:''}

        ${t.tagline?`<div style="font-size:${S(11)}px;color:${A};font-weight:700;letter-spacing:1px;margin-top:2px">${esc(t.tagline)}</div>`:''}
      </div>
      <div style="border-top:2px solid ${A};margin:${S(8)}px 0"></div>
      <div style="text-align:center;font-size:${S(13)}px;letter-spacing:2px;color:#000;font-weight:700">WEIGHBRIDGE TICKET</div>
      <div style="text-align:center;font-size:${S(20)}px;font-weight:900;font-family:'Courier New',monospace;color:#000;margin-top:${S(4)}px;letter-spacing:1px">${esc(tx.id||'')}</div>
      <div style="text-align:center;font-size:${S(15)}px;font-weight:700;color:#000;margin-top:${S(2)}px">${fmtDT(tx.completedAt)}</div>
      <div style="text-align:center;font-size:${S(11)}px;color:#000;margin-top:${S(1)}px">${esc(tx.bridgeName||'')}</div>
      <div style="border-top:1px dashed #aaa;margin:${S(8)}px 0"></div>
      <div style="text-align:center;font-size:${S(11)}px;color:#666;font-weight:700;letter-spacing:1px">VEHICLE</div>
      <div style="text-align:center;font-size:${S(34)}px;font-weight:900;letter-spacing:3px;font-family:'Courier New',monospace;margin:${S(4)}px 0 ${S(10)}px;color:${A}">${esc(tx.vehicleReg||'—')}</div>
      <table style="width:100%;border-collapse:collapse">
        ${detailRow('1st Weight', fmt(tx.firstWeight)+' '+u+'  '+fmtT(tx.firstWeightTime))}
        ${detailRow('2nd Weight', fmt(tx.secondWeight)+' '+u+'  '+fmtT(tx.secondWeightTime))}
      </table>
      <div style="border:3px solid ${A};border-radius:8px;text-align:center;padding:${S(10)}px;margin:${S(10)}px 0">
        <div style="font-size:${S(12)}px;color:${A};font-weight:700;letter-spacing:2px">NET WEIGHT</div>
        <div style="font-size:${big}px;font-weight:900;letter-spacing:2px;font-family:'Courier New',monospace;color:${A}">${fmt(net)} ${u}</div>
        <div style="font-size:${S(12)}px;color:#666;margin-top:2px">${(net/1000).toFixed(3)} tonnes</div>
      </div>
      ${rowsData.length?`<div style="border-top:1px dashed #aaa;margin:${S(8)}px 0"></div>
      <table style="width:100%;border-collapse:collapse">${rowsData.map(r=>detailRow(r[0],r[1])).join('')}</table>`:''}
      ${F.notes&&tx.notes?`<div style="margin-top:${S(6)}px;font-size:${S(12)}px"><b>Notes:</b> ${esc(tx.notes)}</div>`:''}
      ${F.operator?`<div style="border-top:1px dashed #aaa;margin:${S(8)}px 0"></div>
      <div style="font-size:${S(12)}px">Operator: <b>${esc(tx.operatorName||'')}</b></div>`:''}
      ${t.showSignature?`<div style="margin-top:${S(26)}px;border-top:1px solid #000;padding-top:${S(4)}px;text-align:center;font-size:${S(11)}px;color:#666">Driver / Receiver Signature</div>`:''}
      ${copyLbl}
      ${nsTicketQRBlock(tx,t,S(118),A)}
      ${t.footer?`<div style="text-align:center;font-size:${S(11)}px;color:#666;margin-top:${S(8)}px;font-style:italic">${esc(t.footer)}</div>`:''}
      <div style="text-align:center;font-size:${S(9)}px;color:#aaa;margin-top:${S(6)}px">${POWERED_BY}</div>`;
  }

  // ── A4 style (formal, large) ──
  function a4Body(copyLbl){
    const cell=(l,v)=>`<tr><td style="background:#f5f8fc;color:#555;font-size:${S(13)}px;font-weight:700;padding:${S(10)}px ${S(14)}px;text-transform:uppercase;white-space:nowrap;width:160px;border-bottom:1px solid #eef2f7">${l}</td><td style="padding:${S(10)}px ${S(14)}px;font-size:${S(15)}px;font-weight:600;border-bottom:1px solid #eef2f7">${esc(String(v))}</td></tr>`;
    const wbox=(lbl,val,sub,hilite)=>`<td style="border:${hilite?'3px':'1.5px'} solid ${hilite?A:'#D0DCE8'};border-radius:10px;padding:${S(16)}px;text-align:center;background:${hilite?'#EEF3FA':'#fff'};width:33%">
      <div style="font-size:${S(11)}px;color:${hilite?A:'#8AA0B8'};font-weight:700;letter-spacing:1px;margin-bottom:${S(6)}px">${lbl}</div>
      <div style="font-size:${hilite?S(34):S(26)}px;font-weight:900;font-family:'Courier New',monospace;color:${A}">${val}</div>
      <div style="font-size:${S(12)}px;color:#8AA0B8;margin-top:${S(4)}px">${sub}</div></td>`;
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid ${A};padding-bottom:${S(12)}px;margin-bottom:${S(16)}px">
        <div style="flex:1">${t.showLogo!==false?ticketLogoHTML(S(60)).replace('margin:0 auto','margin:0'):''}</div>
        <div style="text-align:right;font-size:${S(12)}px;color:#555;line-height:1.6">
          <div style="font-size:${S(18)}px;font-weight:900;color:${A}">${esc(t.companyName||'')}</div>
          ${t.vat?`<div><b>VAT No:</b> ${esc(t.vat)}</div>`:''}${t.address?`<div>${esc(t.address)}</div>`:''}
          ${t.reg?`<div>Reg: ${esc(t.reg)}</div>`:''}${t.phone?`<div>Tel: ${esc(t.phone)}</div>`:''}
          ${t.email?`<div>${esc(t.email)}</div>`:''}
          ${t.tagline?`<div style="color:${A};font-weight:700">${esc(t.tagline)}</div>`:''}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:${S(14)}px">
        <div><div style="font-size:${S(13)}px;color:#888;letter-spacing:2px;font-weight:700">VEHICLE</div>
          <div style="font-size:${S(30)}px;font-weight:900;letter-spacing:3px;color:${A};font-family:'Courier New',monospace">${esc(tx.vehicleReg||'—')}</div></div>
        <div style="text-align:right;font-size:${S(13)}px;color:#666">
          <div style="font-family:monospace">${esc(tx.id||'')}</div>
          <div>${fmtDT(tx.completedAt)}</div>
          <div>${esc(tx.bridgeName||'')}</div>${copyLbl}</div>
      </div>
      <table style="width:100%;border-collapse:separate;border-spacing:${S(8)}px;margin:0 -${S(8)}px ${S(14)}px"><tr>
        ${wbox('1ST WEIGHT',fmt(tx.firstWeight),u+' · '+fmtT(tx.firstWeightTime),false)}
        ${wbox('2ND WEIGHT',fmt(tx.secondWeight),u+' · '+fmtT(tx.secondWeightTime),false)}
        ${wbox('NET WEIGHT',fmt(net),u+' · '+(net/1000).toFixed(3)+' t',true)}
      </tr></table>
      <table style="width:100%;border-collapse:collapse;border:1px solid #eef2f7;border-radius:8px;overflow:hidden;margin-bottom:${S(16)}px">
        ${rowsData.map(r=>cell(r[0],r[1])).join('')}
      </table>
      ${F.notes&&tx.notes?`<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:${S(12)}px;margin-bottom:${S(16)}px;font-size:${S(14)}px"><b style="color:#d97706">Notes:</b> ${esc(tx.notes)}</div>`:''}
      ${t.showSignature?`<div style="display:flex;gap:${S(40)}px;margin-top:${S(50)}px">
        <div style="flex:1;border-top:1.5px solid ${A};padding-top:${S(6)}px;text-align:center;font-size:${S(13)}px;color:#555">Operator: ${esc(tx.operatorName||'')}</div>
        <div style="flex:1;border-top:1.5px solid ${A};padding-top:${S(6)}px;text-align:center;font-size:${S(13)}px;color:#555">Driver / Receiver Signature</div>
      </div>`:''}
      ${nsTicketQRBlock(tx,t,S(140),A)}
      ${t.footer?`<div style="text-align:center;font-size:${S(13)}px;color:#666;margin-top:${S(20)}px;font-style:italic">${esc(t.footer)}</div>`:''}
      <div style="margin-top:${S(16)}px;border-top:1px solid #D0DCE8;padding-top:${S(8)}px;font-size:${S(11)}px;color:#8AA0B8;text-align:center">${POWERED_BY}</div>`;
  }

  let pages='';
  for(let c=1;c<=copies;c++){
    const copyLbl=copies>1?`<div style="text-align:center;font-size:${S(10)}px;color:#999;margin-top:${S(4)}px">Copy ${c} of ${copies}</div>`:'';
    const body=isA4?a4Body(copyLbl):thermalBody(copyLbl);
    const wrap=isA4
      ? `<div${c<copies?' style="page-break-after:always"':''} style="max-width:720px;margin:0 auto">${body}</div>`
      : `<div${c<copies?' style="page-break-after:always"':''}>${body}</div>`;
    pages+=wrap;
  }

  // ── MONO: rewrite every foreground colour/border to solid black. Greys
  // (#555/#666/#777/#888/#999/#ccc) print faint and washed out on thermal
  // paper — this is what made the ticket hard to read.
  if(MONO){
    pages=pages
      .replace(/color:\s*#[0-9A-Fa-f]{3,8}/g,'color:#000')
      .replace(/color:\s*rgba?\([^)]*\)/g,'color:#000')
      .replace(/(solid|dashed|dotted)\s+#[0-9A-Fa-f]{3,8}/g,'$1 #000')
      .replace(/border-color:\s*#[0-9A-Fa-f]{3,8}/g,'border-color:#000');
  }

  const pageCSS=isA4
    ? `body{font-family:'Segoe UI',Arial,sans-serif;background:#fff;color:${MONO?'#000':'#1A2A3A'};padding:14mm;color-scheme:light;-webkit-print-color-adjust:exact}@page{size:A4;margin:10mm}`
    : `body{font-family:'Segoe UI',Arial,sans-serif;background:#fff;color:#000;width:80mm;margin:0 auto;padding:5mm 4mm;line-height:1.5;color-scheme:light;-webkit-print-color-adjust:exact}@page{size:80mm auto;margin:4mm}`;

  const w=window.open('','_blank','width='+(isA4?'780':'400')+',height=820,scrollbars=yes');
  if(!w){toast('Allow pop-ups to print','error');return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="color-scheme" content="light only"><title>Ticket — ${esc(tx.vehicleReg||'ISS')}</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}${pageCSS}
    .np{text-align:center;padding:14px;border-top:1px dashed #ccc;margin-top:14px}
    @media print{.np{display:none}}</style></head><body>${pages}
    <div class="np">
      <button onclick="window.print()" style="background:${A};color:#fff;border:none;border-radius:6px;padding:11px 28px;font-size:14px;font-weight:700;cursor:pointer;margin-right:8px">🖨 Print (default printer)</button>
      <button onclick="window.close()" style="background:#EEF3FA;color:#4A6080;border:1.5px solid #D0DCE8;border-radius:6px;padding:11px 20px;font-size:14px;cursor:pointer">Close</button>
    </div>
    <script>window.onload=function(){var imgs=[].slice.call(document.images);Promise.all(imgs.map(function(i){return i.complete?1:new Promise(function(r){i.onload=i.onerror=r;});})).then(function(){setTimeout(function(){window.print();},250);});};<\/script></body></html>`);
  w.document.close();
}

// ── TABS ────────────────────────────────────────
const TABS=[
  {id:'dashboard',lbl:'<span class="ti">📊</span> Dashboard',perm:null},
  {id:'weigh',lbl:'<span class="ti">⚖</span> Weigh',perm:'weigh'},
  {id:'manual',lbl:'<span class="ti">✍</span> Manual',perm:'weigh',gated:true},
  {id:'orders',lbl:'<span class="ti">📦</span> Orders',perm:'orders'},
  {id:'fleet',lbl:'<span class="ti">🚛</span> Fleet',perm:'orders'},
  {id:'database',lbl:'<span class="ti">🗄</span> Database',perm:'database'},
  {id:'records',lbl:'<span class="ti">📋</span> Records',perm:'records'},
  {id:'users',lbl:'<span class="ti">👥</span> Users',perm:'master'},
  {id:'audit',lbl:'<span class="ti">📜</span> Audit',perm:'master'},
  {id:'cloud',lbl:'<span class="ti">☁</span> Cloud',perm:'master'},
  {id:'settings',lbl:'<span class="ti">⚙</span> Settings',perm:'master'},
];
function buildTabs(){
  const bar=document.getElementById('tab-bar');
  bar.innerHTML=TABS.filter(t=>t.perm==='master'?session?.role==='master':true).map(t=>
    `<button class="tab${t.id===currentTab?' on':''}" onclick="renderTab('${t.id}')">${t.lbl}</button>`).join('');
}
function renderTab(id){
  const t=TABS.find(x=>x.id===id);
  if(t?.perm==='master'&&session?.role!=='master'){if(!requireMaster())return;}
  else if(t?.perm&&t.perm!=='master'&&!canAccess(t.perm)){toast('Access denied','error');return;}
  // Password-gated tabs (manual weigh): unless master, require the override password
  // once per entry, then proceed.
  if(t?.gated && session?.role!=='master' && !_manualUnlocked){
    passwordGate('Manual weigh — authorise', ()=>{ _manualUnlocked=true; renderTab(id); });
    return;
  }
  currentTab=id; buildTabs();
  const el=document.getElementById('content'); el.innerHTML='';
  ({dashboard:renderDash,weigh:renderWeigh,manual:renderManual,orders:renderOrdersTab,fleet:renderFleet,database:renderDatabase,records:renderRecords,users:renderUsers,audit:renderAudit,cloud:renderCloud,settings:renderSettings})[id]?.();
}
let _manualUnlocked=false;

// ── FLEET ────────────────────────────────────────
// One record per truck. Shared with the other bridge, and auto-fills the
// weigh form so the clerk types a reg once and everything else appears.
function fleetFind(reg){
  const r=String(reg||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!r) return null;
  return fleet.find(f=>String(f.reg||'').toUpperCase().replace(/\s+/g,'')===r)||null;
}
function renderFleet(){
  const q=(_fleetQ||'').toLowerCase();
  const list=fleet.filter(f=>!q||[f.reg,f.trailer1,f.trailer2,f.transporter,f.driver].join(' ').toLowerCase().includes(q))
                  .sort((a,b)=>String(a.reg||'').localeCompare(String(b.reg||'')));
  document.getElementById('content').innerHTML=`
    <div class="sec-hd">
      <div><h2>Fleet</h2><div class="sub">${fleet.length} truck${fleet.length!==1?'s':''} · shared with both weighbridges</div></div>
      <button class="btn btn-navy" onclick="openFleetModal()">+ Add Truck</button>
    </div>
    <div class="card" style="margin-bottom:12px">
      <input id="fl-q" placeholder="🔍 Search reg, trailer, transporter, driver…" value="${esc(_fleetQ)}" oninput="_fleetQ=this.value;renderFleet();document.getElementById('fl-q')?.focus()"/>
    </div>
    ${list.length?`<div class="card" style="padding:0;overflow-x:auto"><table class="tbl"><thead><tr>
      <th>Registration</th><th>Trailer 1</th><th>Trailer 2</th><th>Transporter</th><th>Driver</th><th>Tare</th><th></th>
    </tr></thead><tbody>${list.map(f=>`<tr>
      <td style="font-weight:800;font-family:monospace">${esc(f.reg||'')}</td>
      <td>${esc(f.trailer1||'—')}</td>
      <td>${esc(f.trailer2||'—')}</td>
      <td>${esc(f.transporter||'—')}</td>
      <td>${esc(f.driver||'—')}</td>
      <td>${f.tare?esc(fmt(f.tare))+' '+esc(cfg.weightUnit||'kg'):'—'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="openFleetModal('${f.id}')">✎</button>
        <button class="btn btn-red btn-sm" onclick="delFleet('${f.id}')">✕</button>
      </td></tr>`).join('')}</tbody></table></div>`
    :'<div class="empty"><div class="ico">🚛</div><p>'+(fleet.length?'No trucks match your search':'No trucks yet — add one and it will auto-fill the weigh form')+'</p></div>'}`;
}
let _fleetQ='';
function openFleetModal(id){
  const f=fleet.find(x=>x.id===id)||{id:'',reg:'',trailer1:'',trailer2:'',transporter:'',driver:'',tare:''};
  const dlT=(db.transporters||[]).map(x=>`<option value="${esc(x.name)}">`).join('');
  const dlD=(db.drivers||[]).map(x=>`<option value="${esc(x.name)}">`).join('');
  openModal((id?'Edit Truck':'Add Truck'),`
    <datalist id="fm-dl-tr">${dlT}</datalist><datalist id="fm-dl-dr">${dlD}</datalist>
    <div class="field"><label>Registration *</label><input id="fm-reg" value="${esc(f.reg)}" placeholder="ABC 123 GP" style="text-transform:uppercase"/></div>
    <div class="row2">
      <div class="field"><label>Trailer 1</label><input id="fm-t1" value="${esc(f.trailer1)}" placeholder="TRL 456 GP"/></div>
      <div class="field"><label>Trailer 2</label><input id="fm-t2" value="${esc(f.trailer2)}" placeholder="TRL 789 GP"/></div>
    </div>
    <div class="row2">
      <div class="field"><label>Transporter</label><input id="fm-tr" value="${esc(f.transporter)}" list="fm-dl-tr"/></div>
      <div class="field"><label>Driver</label><input id="fm-dr" value="${esc(f.driver)}" list="fm-dl-dr"/></div>
    </div>
    <div class="field"><label>Tare weight (${esc(cfg.weightUnit||'kg')}) — optional</label><input id="fm-tare" type="number" value="${esc(f.tare)}" placeholder="e.g. 14300"/></div>
    <button class="btn btn-navy btn-full" style="margin-top:10px" onclick="saveFleetTruck('${id||''}')">${id?'Save Changes':'Add Truck'}</button>`);
}
function saveFleetTruck(id){
  const reg=(document.getElementById('fm-reg')?.value||'').trim().toUpperCase();
  if(!reg){toast('Registration is required','error');return;}
  const dup=fleet.find(f=>String(f.reg||'').toUpperCase()===reg && f.id!==id);
  if(dup){toast(reg+' is already in the fleet','error');return;}
  const rec={
    id:id||('fl'+Date.now().toString(36)),
    reg,
    trailer1:(document.getElementById('fm-t1')?.value||'').trim().toUpperCase(),
    trailer2:(document.getElementById('fm-t2')?.value||'').trim().toUpperCase(),
    transporter:(document.getElementById('fm-tr')?.value||'').trim(),
    driver:(document.getElementById('fm-dr')?.value||'').trim(),
    tare:parseFloat(document.getElementById('fm-tare')?.value)||'',
    _at:nowISO()
  };
  const i=fleet.findIndex(f=>f.id===rec.id);
  if(i>=0) fleet[i]=rec; else fleet.push(rec);
  saveFleet();
  auditLog(id?'edit':'create','fleet',rec.id,(id?'Updated ':'Added ')+reg+' to fleet');
  closeModal(); renderFleet(); toast(id?'Truck updated ✓':'Truck added ✓','success');
}
function delFleet(id){
  const f=fleet.find(x=>x.id===id);
  if(!confirm('Remove '+(f?.reg||'this truck')+' from the fleet?\n\nExisting records keep their details.'))return;
  fleet=fleet.filter(x=>x.id!==id);
  saveFleet(); shareDel('fleet',id);
  auditLog('delete','fleet',id,'Removed '+(f?.reg||id)+' from fleet');
  renderFleet();
}

  const truckCards=bPend.map(p=>`
    <div class="truck-card">
      <div><div class="tc-reg">${esc(p.vehicleReg)}</div>
        <div class="tc-info">${esc(p.product||'—')} · ${esc(p.customer||'—')}</div>
        <div class="tc-timer">${elapsed(p.queuedAt||p.firstWeightTime||nowISO())} on site${p.bridgeName?' · in at '+esc(p.bridgeName):''}</div>
      </div>

function autoFillReg(reg){
  if(!reg||reg.length<3)return;
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&!el.value&&v)el.value=v;};
  // 1. Fleet record first — trailers, transporter, driver
  const f=fleetFind(reg);
  if(f){
    set('f-trans',f.transporter); set('f-driver',f.driver);
    const cf=cfg.customFields||[];
    const t1=cf.find(c=>/trailer\s*1/i.test(c.label)), t2=cf.find(c=>/trailer\s*2/i.test(c.label));
    if(t1) set('f-cf-'+t1.id,f.trailer1);
    if(t2) set('f-cf-'+t2.id,f.trailer2);
  }
  // 2. Then last load for this reg — product, customer, route
  const last=txs.find(t=>t.vehicleReg===reg);

  set('f-prod',last.product);set('f-cust',last.customer);set('f-trans',last.transporter);
  set('f-sup',last.supplier);set('f-dest',last.destination);set('f-driver',last.driver);

  const o=orders.find(x=>String(x.no)===String(val)||x.id===val);
  if(!o) return;   // free-typed number with no matching order — nothing to autofill
  const set=(el,v)=>{const e=document.getElementById(el);if(e&&v)e.value=v;};
  set('f-prod',o.product);set('f-cust',o.customer);set('f-trans',o.transporter);
  set('f-sup',o.supplier);set('f-dest',o.destination);
  toast('Order '+o.no+' applied'+(o.fleet?.length?' · fleet restricted ('+o.fleet.length+' regs)':''),'info');
}

// ── FLEET IMPORT (Excel .xlsx / .csv) ─────────────
// .xlsx is a ZIP of XML. Electron/Chromium ships DecompressionStream('deflate-raw'),
// so we can read a real spreadsheet offline with no external library.
async function _inflateRaw(bytes){
  const ds=new DecompressionStream('deflate-raw');
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function _unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), files={};
  // find End Of Central Directory
  let eocd=-1;
  for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('Not a valid .xlsx (no ZIP directory)');
  const count=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true);
    const extraLen=dv.getUint16(p+30,true);
    const commLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    // local header -> data offset
    const lNameLen=dv.getUint16(lho+26,true), lExtraLen=dv.getUint16(lho+28,true);
    const dataStart=lho+30+lNameLen+lExtraLen;
    const raw=u8.subarray(dataStart,dataStart+csize);
    files[name]= method===0 ? Promise.resolve(raw) : _inflateRaw(raw);
    p+=46+nameLen+extraLen+commLen;
  }
  for(const k of Object.keys(files)) files[k]=await files[k];
  return files;
}
function _colToIdx(ref){ // "BC12" -> 54
  const m=/^([A-Z]+)/.exec(ref); if(!m) return 0;
  let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}
async function parseXLSX(buf){
  const files=await _unzip(buf);
  const dec=new TextDecoder();
  const P=new DOMParser();
  // shared strings
  let shared=[];
  if(files['xl/sharedStrings.xml']){
    const d=P.parseFromString(dec.decode(files['xl/sharedStrings.xml']),'application/xml');
    shared=[...d.getElementsByTagName('si')].map(si=>
      [...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  }
  // first worksheet
  const sheetName=Object.keys(files).filter(n=>/^xl\/worksheets\/sheet\d*\.xml$/.test(n)).sort()[0];
  if(!sheetName) throw new Error('No worksheet found in workbook');
  const d=P.parseFromString(dec.decode(files[sheetName]),'application/xml');
  const rows=[];
  for(const row of d.getElementsByTagName('row')){
    const cells=[];
    for(const c of row.getElementsByTagName('c')){
      const idx=_colToIdx(c.getAttribute('r')||'A1');
      const t=c.getAttribute('t');
      let v='';
      if(t==='inlineStr'){ v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''); }
      else{
        const vEl=c.getElementsByTagName('v')[0];
        if(vEl){ v=vEl.textContent; if(t==='s') v=shared[parseInt(v)]??''; }
      }
      cells[idx]=String(v).trim();
    }
    rows.push(cells);
  }
  return rows;
}
function parseCSVRows(text){
  const rows=[]; let cell='',row=[],q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(c==='"'){q=false;}
      else cell+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','||c===';'||c==='\t'){row.push(cell);cell='';}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else if(c!=='\r')cell+=c;
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function normReg(s){ return String(s||'').trim().toUpperCase().replace(/\s+/g,' '); }
// Pick the registration column: prefer a header named reg/vehicle/fleet/plate, else col A.
function extractRegs(rows){
  if(!rows.length) return [];
  const hdr=(rows[0]||[]).map(c=>String(c||'').toLowerCase());
  let col=hdr.findIndex(h=>/reg|vehicle|fleet|plate|truck|horse/.test(h));
  let start=0;
  if(col>=0) start=1; else col=0;
  const out=[];
  for(let i=start;i<rows.length;i++){
    const v=normReg((rows[i]||[])[col]);
    if(v && !/^(reg|registration|vehicle|fleet|plate)$/i.test(v)) out.push(v);
  }
  return [...new Set(out)];
}
async function importFleetFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  try{
    let rows;
    if(/\.xlsx$/i.test(f.name)) rows=await parseXLSX(await f.arrayBuffer());
    else if(/\.(csv|txt|tsv)$/i.test(f.name)) rows=parseCSVRows(await f.text());
    else if(/\.xls$/i.test(f.name)){ toast('Old .xls not supported — save as .xlsx or .csv','error',6000); input.value=''; return; }
    else { toast('Use a .xlsx or .csv file','error'); input.value=''; return; }
    const regs=extractRegs(rows);
    if(!regs.length){ toast('No vehicle registrations found in that file','error',5000); input.value=''; return; }
    const ta=document.getElementById('o-fleet');
    const existing=(ta.value||'').split(/[\n,;]+/).map(normReg).filter(Boolean);
    const merged=[...new Set([...existing,...regs])];
    ta.value=merged.join('\n');
    const added=merged.length-existing.length;
    toast('✓ Imported '+regs.length+' registration'+(regs.length!==1?'s':'')+' ('+added+' new) from '+f.name,'success',5000);
  }catch(e){
    console.error(e);
    toast('Could not read file: '+(e.message||e),'error',6000);
  }
  input.value='';
}

function saveManualTx(printType){
  if(!manualDir){ toast('Pick Loading or Off Loading first','error'); return; }
  const g=id=>(document.getElementById(id)?.value||'').trim();
  const reg=g('m-reg').toUpperCase();
  let w1=parseFloat(g('m-w1')), w2=parseFloat(g('m-w2'));
  if(isFinite(w1)) w1=applyDivision(w1, activeBridge);
  if(isFinite(w2)) w2=applyDivision(w2, activeBridge);
  if(!reg){ toast('Vehicle reg required','error'); return; }
  if(isNaN(w1)||isNaN(w2)){ toast('Enter both weights','error'); return; }
  // Order field is type-or-pick: value is the order NUMBER. Match to a record if
  // possible, else keep the free-typed number.
  const ordTyped=g('m-ord');
  const matchOrder=orders.find(o=>String(o.no)===ordTyped);
  const orderId=matchOrder?matchOrder.id:'';
  const orderNoManual=matchOrder?'':ordTyped;
  if(matchOrder){
    if(matchOrder.active===false){ toast('Order '+matchOrder.no+' is closed','error'); return; }
    if(matchOrder.fleet&&matchOrder.fleet.length>0&&!matchOrder.fleet.includes(reg)){ toast('⛔ '+reg+' not on fleet list for '+matchOrder.no,'error'); return; }
  }
  // Batch Number / Dispatch Ticket Nr — one field, meaning depends on direction.
  const bd=g('m-batchdisp');
  const batchNo          = dirFieldIsDispatch(manualDir) ? '' : bd;
  const dispatchTicketNo = dirFieldIsDispatch(manualDir) ? bd : '';
  // All other custom fields (Trailer 1, Trailer 2, Seal No, …) from m-cf-* inputs.
  const custom=(cfg.customFields||[]).filter(cf=>cf.id!=='cfBatch').map(cf=>({
    id:cf.id, label:cf.label, onTicket:cf.onTicket!==false,
    value:(document.getElementById('m-cf-'+cf.id)?.value||'').trim()
  })).filter(c=>c.value);
  if(batchNo) custom.push({id:'cfBatch',label:'Batch No',onTicket:true,value:batchNo});
  const net=Math.abs(w1-w2);
  const now=nowISO();
  const tx={...emptyTx(),
    id:txId(), vehicleReg:reg, orderId, orderNoManual, direction:manualDir,
    batchNo, dispatchTicketNo, custom,
    product:g('m-prod'), customer:g('m-cust'), transporter:g('m-trans'), supplier:g('m-sup'),
    destination:g('m-dest'), driver:g('m-drv'), notes:g('m-notes'),
    firstWeight:w1, firstWeightTime:now, secondWeight:w2, secondWeightTime:now,
    net, completedAt:now, manual:true,
    bridgeName:(cfg.bridges[activeBridge]?.name)||('Bridge '+(activeBridge+1)),
    operatorName:session?.name||''};
  stampTx(tx);
  txs.unshift(tx); saveTxs(); syncTxToBox(txs[0]); autoBackup('tx');
  auditLog('complete','tx',tx.id,'MANUAL '+reg+' NET '+net+'kg ('+(tx.product||'—')+')');
  checkOrderCompletion(orderId);
  toast('✓ Manual ticket saved: '+reg+' — '+fmt(net)+' '+u_(),'success',5000);
  if(printType==='thermal') printThermal(tx);
  else if(printType==='a4') printA4(tx);
  manualDir=null;
  renderManual();
}

function saveOrder(){
  const no=(document.getElementById('o-no')?.value||'').trim();
  if(!no){toast('Order number required','error');return;}
  const fleet=document.getElementById('o-fleet')?.value.split(/[\n,;]+/).map(r=>r.trim().toUpperCase().replace(/\s+/g,' ')).filter(Boolean)||[];
  const data={no,product:(document.getElementById('o-prod')?.value||'').trim(),customer:(document.getElementById('o-cust')?.value||'').trim(),
    transporter:(document.getElementById('o-trans')?.value||'').trim(),supplier:(document.getElementById('o-sup')?.value||'').trim(),
    destination:(document.getElementById('o-dest')?.value||'').trim(),rate:parseFloat(document.getElementById('o-rate')?.value)||null,
    targetKg:parseFloat(document.getElementById('o-tkg')?.value)*1||null,fleet,active:true};
  if(editingOrder){
    const i=orders.findIndex(x=>x.id===editingOrder);
    if(i>=0)orders[i]=Object.assign(orders[i],data);
  }else{
    if(orders.find(x=>x.no===no)){toast('Order number already exists','error');return;}
    orders.unshift({id:'O'+Date.now(),created:nowISO(),...data});
  }
  saveOrders();closeModal();renderOrdersTab();toast('Order saved ✓','success');
}

let recFilter={q:'',from:'',to:'',bridge:'',prod:'',dir:'',cfId:'',cfVal:''};
function applyFilters(){
  recFilter.q=document.getElementById('r-q')?.value||'';
  recFilter.from=document.getElementById('r-from')?.value||'';
  recFilter.to=document.getElementById('r-to')?.value||'';
  recFilter.bridge=document.getElementById('r-bridge')?.value??'';
  recFilter.prod=document.getElementById('r-prod')?.value||'';
  recFilter.dir=document.getElementById('r-dir')?.value||'';
  const prevCf=recFilter.cfId;
  recFilter.cfId=document.getElementById('r-cf')?.value||'';
  recFilter.cfVal=document.getElementById('r-cfv')?.value||'';
  if(prevCf!==recFilter.cfId) recFilter.cfVal='';   // switching field clears the value
  renderRecords();
}
function setRange(preset){
  const today=new Date(); const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let from='',to=ymd(today);
  if(preset==='today'){ from=ymd(today); }
  else if(preset==='7'){ const d=new Date(today); d.setDate(d.getDate()-6); from=ymd(d); }
  else if(preset==='30'){ const d=new Date(today); d.setDate(d.getDate()-29); from=ymd(d); }
  else if(preset==='month'){ from=ymd(new Date(today.getFullYear(),today.getMonth(),1)); }
  else if(preset==='all'){ from=''; to=''; }
  recFilter.from=from; recFilter.to=to;
  const fEl=document.getElementById('r-from'), tEl=document.getElementById('r-to');
  if(fEl) fEl.value=from; if(tEl) tEl.value=to;
  renderRecords();
}
function filteredTxs(){
  return txs.filter(t=>{
    if(recFilter.q){
      const cf=(t.custom||[]).map(c=>c.value).join(' ');
      const hay=[t.vehicleReg,t.product,t.customer,t.transporter,t.supplier,t.destination,t.driver,t.id,cf].join(' ').toLowerCase();
      if(!hay.includes(recFilter.q.toLowerCase()))return false;
    }
    if(recFilter.cfId&&recFilter.cfVal){
      const c=(t.custom||[]).find(x=>x.id===recFilter.cfId);
      if(!c||!String(c.value).toLowerCase().includes(recFilter.cfVal.toLowerCase()))return false;
    }
    const ymd=txYMD(t.completedAt);
    if(recFilter.from&&ymd<recFilter.from)return false;
    if(recFilter.to&&ymd>recFilter.to)return false;
    if(recFilter.bridge!==''&&String(t.bridge)!==String(recFilter.bridge))return false;
    if(recFilter.prod&&t.product!==recFilter.prod)return false;
    if(recFilter.dir&&txDir(t)!==recFilter.dir)return false;
    return true;
  });
}

function exportCSV(){
  const f=filteredTxs();
  if(!f.length){toast('No records','error');return;}
  const u=cfg.weightUnit||'kg';
  const q=v=>{ let s=(v==null?'':String(v)).replace(/\r?\n/g,' '); return '"'+s.replace(/"/g,'""')+'"'; };
  const row=arr=>arr.map(q).join(',');
  // Resolve the human order NUMBER: from a matching order record, else the
  // free-typed order number stored on the tx. Never emit the internal id.
  const ordNo=t=>{
    if(t.orderId){ const o=orders.find(x=>x.id===t.orderId); if(o) return o.no||''; }
    return t.orderNoManual||'';
  };
  // Batch and Dispatch Ticket Nr: prefer the explicit fields set at 1st weigh,
  // fall back to the cfBatch custom field for older records.
  const cf=(t,id)=>((t.custom||[]).find(c=>c.id===id)||{}).value||'';
  const batchOf=t=>t.batchNo||cf(t,'cfBatch');
  const dispOf =t=>t.dispatchTicketNo||'';
  // Column order mirrors the client's spreadsheet exactly. One blank spacer
  // remains, at position 2. "Action" = load direction (from the 1st-weigh choice).
  // Weights run Empty, Full, Net after Reg. Dispatch Ticket Nr sits next to Batch.
  // 24 columns total.
  const cols=['Ticket','','Customer','Product','Action','Date','Time In','Time Out','Reg',
              'Empty Weight ('+u+')','Full Weight ('+u+')','Net ('+u+')',
              'Batch No','Dispatch Ticket Nr','Destination','Transporter','Order','Trailer 1','Trailer 2',
              'Seal No','Bridge','Operator','Driver','Supplier'];
  const lines=[];
  // report header block
  lines.push(row([(cfg.companyName||ISS_CO.name)+' Weighbridge — Records Report']));
  lines.push(row(['Site',cfg.siteName||cfg.companyName||ISS.name]));
  lines.push(row(['Period',(recFilter.from||'start')+' to '+(recFilter.to||'today')]));
  lines.push(row(['Generated',fmtDT(new Date().toISOString())]));
  lines.push('');
  lines.push(row(cols));
  let totNet=0,tot1=0,tot2=0;
  f.forEach(t=>{
    const net=t.net||0; totNet+=net; tot1+=t.firstWeight||0; tot2+=t.secondWeight||0;
    // Full = heavier weight, Empty = lighter — purely by mass, independent of
    // weigh order or direction. If a weight is missing, leave both blank.
    const w1=t.firstWeight, w2=t.secondWeight;
    const haveBoth=(w1!=null&&w2!=null);
    const full=haveBoth?Math.max(w1,w2):'';
    const empty=haveBoth?Math.min(w1,w2):'';
    lines.push(row([
      t.id, '', t.customer, t.product, txDirReport(t), fmtD(t.completedAt), fmtT(t.firstWeightTime), fmtT(t.secondWeightTime), t.vehicleReg,
      empty, full, net,
      batchOf(t), dispOf(t), t.destination, t.transporter, ordNo(t),
      cf(t,'cfTrl1'), cf(t,'cfTrl2'), cf(t,'cfSeal'), t.bridgeName, t.operatorName, t.driver, t.supplier
    ]));
  });
  // totals row: loads count in col 9, Net total under Net column = position 12
  lines.push(row(['TOTAL','','','','','','','',f.length+' loads','','',totNet]));
  lines.push(row(['','','','','','','','','','','Net tonnes',(totNet/1000).toFixed(3)]));
  // product summary
  const byProd={}; f.forEach(t=>{ byProd[t.product||'—']=(byProd[t.product||'—']||0)+(t.net||0); });
  lines.push('');
  lines.push(row(['Product Summary','Net ('+u+')','Tonnes']));
  Object.entries(byProd).sort((a,b)=>b[1]-a[1]).forEach(([p,n])=>lines.push(row([p,n,(n/1000).toFixed(3)])));

  const csv='\uFEFF'+lines.join('\r\n');   // BOM => Excel opens columns cleanly
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const tag=(recFilter.from||recFilter.to)?((recFilter.from||'')+'_'+(recFilter.to||'')):new Date().toISOString().slice(0,10);
  a.download='ISS-Records-'+tag+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  auditLog('config','records','','Exported CSV ('+f.length+' rows)');
  toast('CSV exported — '+f.length+' rows, '+(totNet/1000).toFixed(2)+' t','success');
}

async function saveUser(id){
  const name=(document.getElementById('u-name')?.value||'').trim();
  const pin=(document.getElementById('u-pin')?.value||'').trim();
  if(!name){toast('Enter a name','error');return;}
  if(!id&&(pin.length!==4||!/^\d{4}$/.test(pin))){toast('PIN must be 4 digits','error');return;}
  const isMasterU=id==='master';
  if(!isMasterU){
    const perms={};Object.keys(PERMS).forEach(k=>{perms[k]=document.getElementById('pc-'+k)?.classList.contains('on');});
    const active=document.getElementById('u-active')?.value!=='0';
    if(id){const u=users.find(x=>x.id===id);if(u){u.name=name;if(pin){u.pinHash=await hashStr(pin);delete u.pin;}u.perms=perms;u.active=active;auditLog('edit','user',id,'Edited clerk '+name);}}
    else{const nh=await hashStr(pin);users.push({id:'U'+Date.now(),name,pinHash:nh,role:'clerk',active:true,perms});auditLog('create','user',name,'Created clerk '+name);}
  }else{
    const u=users.find(x=>x.id==='master');if(u){u.name=name;if(pin){if(pin.length!==4||!/^\d{4}$/.test(pin)){toast('PIN must be 4 digits','error');return;}u.pinHash=await hashStr(pin);delete u.pin;auditLog('edit','user','master','Changed master PIN');}}
  }
  saveUsers();closeModal();renderUsers();toast('User saved ✓','success');
}
